<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerFS × dsh</title>
<link rel="icon" href="data:,">
<style>
/* The page's own chrome: title bar, story picker and player. The view
   (tabs, work area, avatars) is styled by @dsh-layerfs/view. */
html, body { margin: 0; height: 100%; }
body { overflow: hidden; }
.window { height: 100%; display: flex; flex-direction: column; background: var(--window); }
.titlebar { height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; background: var(--chrome); border-bottom: .5px solid var(--sep); }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-right: 6px; white-space: nowrap; }
.brand small { font-weight: 400; color: var(--text-2); font-size: 11px; }
.mode { display: inline-flex; border: 1px solid var(--sep-strong); border-radius: 6px; overflow: hidden; font: 600 10.5px/1 var(--mono, ui-monospace, monospace); flex: none; }
.mode a { padding: 4px 7px; color: var(--text-2); text-decoration: none; }
.mode a.on { background: var(--accent); color: #fff; }
.mode a.on[data-mode="live"] { background: var(--green, #1f9d55); }
.ib:disabled { opacity: .35; cursor: default; }
.player .dots.locked i { cursor: default; }
.player .ev .busy { color: var(--orange); }
.player .ev .err { color: var(--red); }
.player .ev .ok { color: var(--green); }
.storysel { font: 500 11.5px var(--font); border: 1px solid var(--sep-strong); border-radius: 6px; background: var(--card); color: var(--text); padding: 3px 4px; flex: none; max-width: 140px; }
.player { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--chrome); border-top: .5px solid var(--sep); min-height: 64px; }
.player .ctl { display: flex; gap: 2px; flex: none; }
.player .count { font: 600 12px var(--mono); color: var(--text-2); width: 46px; text-align: center; flex: none; }
.player .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.player .cap { font-size: 13px; line-height: 1.4; min-height: 18px; }
.player .cap code { font: 12px var(--mono); background: var(--well); padding: 1px 5px; border-radius: 4px; }
.player .ev { font: 11px var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .ev b { color: var(--t-purple); font-weight: 600; }
.player .ev .bad { color: var(--t-red); font-weight: 600; }
.player .dots { display: flex; gap: 3px; }
.player .dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--sep-strong); cursor: pointer; }
.player .dots i.done { background: var(--accent); }
.player .dots i.now { background: var(--orange); }
.player select { font: 12px var(--font); color: var(--text); background: var(--well); border: 1px solid var(--sep-strong); border-radius: 6px; height: 26px; }
@media (max-width: 860px) {
  body { overflow: auto; }
  .window { height: auto; min-height: 100%; }
  .player { flex-wrap: wrap; position: sticky; bottom: 0; }
  .player .mid { flex-basis: 100%; order: 5; }
  .brand small, #follow .lbl { display: none; }
  .titlebar { padding: 0 6px 0 10px; gap: 4px; }
}
@media (max-width: 520px) {
  .bname { display: none; }
  .brand { margin-right: 0; }
  .storysel { max-width: 92px; }
  .mode a { padding: 4px 5px; }
}
</style>
</head>
<body>
<div class="window" id="root">
  <header class="titlebar">
    <div class="brand"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 1l7 3.5-7 3.5L1 4.5z" fill="currentColor"/><path d="M1 8l7 3.5L15 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M1 11.5L8 15l7-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" opacity=".55"/></svg><span class="bname">LayerFS × dsh</span> <small>design preview · scripted</small></div>
    <span class="mode" id="mode" title="Engine: sim = the simulator in this page; live = real LayerFS through node sdk_sim/server/server.mjs"><a data-mode="sim" href="?backend=sim">sim</a><a data-mode="live" href="?backend=live">live</a></span>
    <select class="storysel" id="story" title="Story: the dsh design story, or a tui.html demo story played by dsh agents"><option value="dsh">dsh story</option><option value="agents">Demo · 5 agents</option><option value="tour">Demo · Tour</option><option value="conflicts">Demo · Conflicts</option><option value="merge">Demo · Commit &amp; merge</option></select>
    <div class="tabs" id="tabs" role="tablist" aria-label="Tabs"></div>
    <button class="ib on" id="follow" title="Follow the acting agent across tabs (F)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg><span class="lbl">Follow</span></button>
    <button class="ib" id="theme" title="Toggle light / dark"><svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 100 12V2z" fill="currentColor"/><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
  </header>
  <main class="work" id="work"></main>
  <footer class="player" aria-label="Story player">
    <div class="ctl">
      <button class="ib" id="p-reset" title="Restart">⏮</button>
      <button class="ib" id="p-prev" title="Previous step (←)">◀</button>
      <button class="ib on" id="p-play" title="Play / pause (space)">▶</button>
      <button class="ib" id="p-next" title="Next step (→)">▶|</button>
    </div>
    <div class="count" id="p-count"></div>
    <div class="mid">
      <div class="cap" id="p-cap"></div>
      <div class="ev" id="p-ev"></div>
      <div class="dots" id="p-dots"></div>
    </div>
    <select id="p-speed" aria-label="Speed"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option><option value="2.5">2.5×</option></select>
  </footer>
</div>

<!-- The engine: the LayerFS SDK simulator and its shell, shared with tui.html. -->
<script src="simulation_engine/model.js"></script>
<script src="simulation_engine/files.js"></script>
<script src="simulation_engine/terminal.js"></script>
<script src="simulation_engine/backend/sim.js"></script>
<script src="simulation_engine/backend/live.js"></script>
<script src="scenarios.js"></script>
<script src="demo.js"></script>
<script src="dsh_story.js"></script>
<!-- The view model and the view: @dsh-layerfs/model and @dsh-layerfs/view, shared with the dsh client plugin. --><script type="module">
import * as X from "../dsh/packages/model/src/index.js";
import { createView, injectStyle, heroAvatars } from "../dsh/packages/view/src/index.js";
const SCOUTS = window.LAYERFS_DSH_STORY.SCOUTS;
const M = window.LayerSim, FM = window.LayerFiles, { simulateShell, liveCommand, execLines, Engine } = window.LayerTerm;
// ?backend=sim (default): the simulator in this page, with a free player.
// ?backend=live: the real product through server/server.mjs (one project
// per run, every call really made), so the player only goes forward.
const LIVE = new URLSearchParams(location.search).get("backend") === "live";
// Compressed sizes are computed asynchronously and shared across rebuilds.
const PACKED = new Map(), PACKING = new Set();
let renderSoon = null;
const rerender = () => { clearTimeout(renderSoon); renderSoon = setTimeout(() => view.render(), 40); };
const FIXTURE = window.LAYERFS_SCENARIOS[0].steps[0].args.files;

// ------------------------------------------------------------------ story
// The dsh story (dsh_story.js), or ?source=trace&file=<jsonl>: an SDK trace
// replayed through the model (sources/trace.js), or a demo story (below).
const PARAMS = new URLSearchParams(location.search);
const TRACE_FILE = PARAMS.get("source") === "trace" ? PARAMS.get("file") : null;
const TRACE_LINES = TRACE_FILE ? X.parseTrace(await (await fetch(TRACE_FILE)).text()) : null;
const DSH_STORY = window.LAYERFS_DSH_STORY.story(FIXTURE);

// ------------------------------------------------------------------ demo stories (demo.js)
// ?story=agents|tour|conflicts|merge plays a tui.html demo story. Its steps
// run through the same terminal engine as tui.html (terminal.js Engine, which
// test_demo.js checks), so every outcome matches tui.html on either backend.
// dsh adds what the engine does not know: which agent made each call.
// An agent step is one Bash tool call: mount a Workspace in the Branch's
// shared Sandbox, run, commit, unmount. Each phase is one frame, in demo.js's
// own schedule, so the calls of a burst interleave as they do in tui.html.
const STORY_KEY = PARAMS.get("story") || "dsh";
const DEMO = TRACE_LINES ? null : (window.LAYERFS_DEMO || {})[STORY_KEY] || null;
const LEAD = DEMO && DEMO.roster ? "lead" : "main";

// ------------------------------------------------------------------ the view (@dsh-layerfs/view)
// It draws W into this page: tabs in the title bar, the work area and the
// avatars (the LayerFS website's heroes). The main agent is the
// cloud; every other agent gets a hero hashed from its name.
const $ = (id) => document.getElementById(id);
injectStyle();
const view = createView($("root"), {
  avatars: heroAvatars((h) => `../dsh/packages/view/src/skins/heroes/images/${h}.png`), files: FM, lineDiff: M.lineDiff, live: LIVE, lead: LEAD,
  layout: { tabs: $("tabs"), work: $("work"), follow: $("follow") },
  onFollowOn: () => go(step),
});
// the cast in story order: the lead first, then everyone this story uses
for (const n of [LEAD, ...(DEMO ? Object.keys(DEMO.roster || {}) : ["main", "ui-dev", "tester", ...SCOUTS])]) view.avatar(n);
const STORY = TRACE_LINES ? X.traceSteps(TRACE_LINES, { agent: LEAD }) : DEMO ? X.demoFrames(DEMO, { lead: LEAD, fixture: FIXTURE, schedule: window.LAYERFS_DEMO.schedule }) : DSH_STORY;

// ------------------------------------------------------------------ driver
// W is the view model (X.createView): the engine (W.engine: sim, live or a
// trace replay, same surface) plus what dsh knows and the engine does not:
// which agent made each call, where each agent is, and the lines each terminal
// printed. The model (dsh/packages/model) builds it; the view draws it.
const EMPTY_STATE = () => ({ project: null, main: null, roots: {}, commits: {}, layers: {}, branches: {}, branchOrder: [], sandboxes: {}, sandboxOrder: [] });
const ENV = {
  live: LIVE, simulateShell, liveCommand, execLines, scriptFor: M.scriptFor, diffTrees: M.diffTrees,
  loaded: (r, w) => !LIVE || w.engine.trees[r],
  // a demo read that names a file opens it in that tab's Files view
  onFiles: (tab, files) => { const f = view.files.filesOf(tab); f.path = files.path; f.mode = files.mode; view.setRight(tab, "files"); },
};
function fresh() {
  let engine;
  if (TRACE_LINES) engine = new X.ReplayEngine({ project: PARAMS.get("project") || "website" });
  else if (LIVE) { engine = new window.LayerBackendLive.LiveBackend(); engine.state = EMPTY_STATE(); }
  else { engine = new window.LayerBackendSim.SimBackend(); engine.packed = PACKED; engine.packing = PACKING; }
  engine.onchange = rerender;
  return X.storyView(engine, { lead: LEAD, demo: DEMO, Engine });
}
const runStep = (w, st) => X.runStep(w, st, ENV);

// ------------------------------------------------------------------ view state
let step = 0, playing = !LIVE, timer = null;
view.W = fresh();
// for checks from the console and tests: the page's view, story and model
window.__dsh = { get W() { return view.W; }, fresh, runStep, STORY, X, view };

// ------------------------------------------------------------------ player
// Steps run one at a time (live calls take real time). Sim rewinds by
// replaying from a fresh engine; live has one real project, so it only steps
// forward, and Restart begins a new project at step 1.
let queue = Promise.resolve(), running = null, failed = null;
async function rebuild(to) { const w = fresh(); for (let i = 0; i < to; i++) await runStep(w, STORY[i]); return w; }
function goto(i, animate) {
  const job = queue.then(() => gotoNow(i, animate));
  queue = job.catch(() => {});
  return job;
}
async function gotoNow(i, animate) {
  i = Math.max(0, Math.min(STORY.length, i));
  if (LIVE && i !== 0 && i !== step && i !== step + 1) return;
  failed = null;
  try {
    if (i === step + 1) { running = STORY[step]; renderPlayer(); await runStep(view.W, STORY[step]); }
    else if (i !== step || !LIVE) view.W = await rebuild(i);
  } catch (e) {
    running = null; failed = e.message;
    setPlaying(false); view.render(); renderPlayer(); throw e;
  }
  running = null;
  step = i;
  const ev = STORY[step - 1];
  view.lastLoc = ev && ev.a !== "dsh" ? X.locKey(X.where(view.W, ev.a)) : null;
  view.acting = ev && ev.burst ? ev.burst.map((e) => e.a) : ev ? [ev.a] : [];
  if (view.follow && ev && ev.call !== "dsh.spawn") view.active = view.W.lastTab || "main";
  view.render(); renderPlayer();
  if (animate && ev) view.animate(ev.a);
}
function renderPlayer() {
  const W = view.W, ev = STORY[step - 1], esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  for (const a of document.querySelectorAll("#mode a")) a.classList.toggle("on", (a.dataset.mode === "live") === LIVE);
  $("p-prev").disabled = LIVE; $("p-dots").classList.toggle("locked", LIVE);
  $("p-reset").title = LIVE ? "New project: restart the story on a fresh volume" : "Restart";
  $("p-count").textContent = `${step}/${STORY.length}`;
  let cap = ""; for (let i = step - 1; i >= 0 && !cap; i--) if (STORY[i].cap) cap = STORY[i].cap;
  $("p-cap").innerHTML = cap || "Press ▶ to play the story, or step with ← →.";
  const shown = (st) => st.label ? st.label : st.sh ? `sandbox.exec ${JSON.stringify({ command: st.sh })}` : `${st.call} ${JSON.stringify(Object.fromEntries(Object.entries(st.args || {}).filter(([k]) => !["files", "content", "agents"].includes(k))))}`;
  $("p-ev").innerHTML = ev && ev.script ? `events · <b>${esc(ev.a)}</b> ×${ev.calls.length} · group <b>${esc(ev.script)}</b> · ${esc(ev.calls.map((c) => c.sh ? "sandbox.exec" : c.call).join(", "))}${W.last ? ` → <span class="${W.last.o.ok ? "" : "bad"}">${esc(W.last.o.code)}</span>` : ""}`
    : ev && ev.burst ? `events · <b>×${ev.burst.length}</b> ${esc([...new Set(ev.burst.map((e) => e.call))].join(", "))} from ${ev.burst.length} agents`
    : ev && ev.a !== "dsh" ? `event · <b>${esc(ev.a)}</b> ${esc(shown(ev))}${W.last ? ` → <span class="${W.last.o.ok ? "" : "bad"}">${esc(W.last.o.code)}</span>` : ""}`
    : ev ? `dsh · ${esc(ev.label || ev.call.slice(4))}` : "event · —";
  // demo stories: the step's outcome against what demo.js expects
  if (W.check) $("p-ev").innerHTML += W.check.ok ? ` <span class="ok" title="demo.js expects ${esc(W.check.expect)}">✓ as expected</span>` : ` <span class="err">✕ expected ${esc(W.check.expect)}, got ${esc(W.check.code)}</span>`;
  if (running) $("p-ev").innerHTML = `<span class="busy">running ${esc(running.a)} · ${esc(running.label || (running.sh ? "sandbox.exec " + running.sh : running.call))}…</span>`;
  if (failed) $("p-ev").innerHTML = `<span class="err">✕ ${esc(failed)}</span>`;
  $("p-dots").innerHTML = STORY.map((_, i) => `<i class="${i < step - 1 ? "done" : i === step - 1 ? "now" : ""}" data-step="${i + 1}" title="step ${i + 1}"></i>`).join("");
  $("p-play").textContent = playing ? "❚❚" : "▶";
}
async function tick() {
  clearTimeout(timer);
  if (!playing) return;
  if (step >= STORY.length) { playing = false; renderPlayer(); return; }
  const t0 = performance.now();
  try { await goto(step + 1, true); } catch (e) { console.error(e); setPlaying(false); return; }
  const ms = 2300 * (STORY[step - 1].w ?? 1) / (DEMO && DEMO.speed ? DEMO.speed : 1) / +$("p-speed").value;
  if (playing) timer = setTimeout(tick, Math.max(LIVE ? 400 : 0, ms - (performance.now() - t0)));
}
function setPlaying(p) { playing = p; renderPlayer(); clearTimeout(timer); if (p) timer = setTimeout(tick, 400); }

// A failed step is shown in the player (gotoNow), so handlers drop the rejection.
const go = (i, animate) => goto(i, animate).catch((e) => console.error(e));
$("p-play").onclick = () => { if (!playing && step >= STORY.length) go(0); setPlaying(!playing); };
$("p-next").onclick = () => { setPlaying(false); go(step + 1, true); };
$("p-prev").onclick = () => { if (LIVE) return; setPlaying(false); go(step - 1); };
$("p-reset").onclick = () => { setPlaying(false); go(0); };
$("p-dots").onclick = (e) => { const s = e.target.dataset.step; if (s && !LIVE) { setPlaying(false); go(+s); } };
// Mode links and the story picker keep the other choice.
for (const a of document.querySelectorAll("#mode a")) a.href = `?backend=${a.dataset.mode}&story=${STORY_KEY}`;
$("story").value = DEMO ? STORY_KEY : "dsh";
$("story").onchange = (e) => { location.search = `?backend=${LIVE ? "live" : "sim"}&story=${e.target.value}`; };
$("theme").onclick = () => {
  const root = $("root"), dark = matchMedia("(prefers-color-scheme: dark)").matches, cur = root.dataset.theme || (dark ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark"; view.render();
};
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("select, input, textarea")) return;
  if (e.key === " ") { e.preventDefault(); $("p-play").click(); }
  else if (e.key === "ArrowRight") $("p-next").click();
  else if (e.key === "ArrowLeft") $("p-prev").click();
  else if (e.key === "f" || e.key === "F") $("follow").click();
});

// Live: a process that exits on its own (or a Workspace changed outside a
// call) shows up through the server's state poll.
if (LIVE) setInterval(async () => {
  if (running || !view.W.engine.s.project) return;
  try { if (await view.W.engine.poll()) { X.derive(view.W); view.render(); } } catch { /* the server may be resetting */ }
}, 3000);
go(0).then(() => { renderPlayer(); if (!LIVE) setPlaying(true); });
</script>
</body>
</html>
