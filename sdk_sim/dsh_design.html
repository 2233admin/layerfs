<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerFS × dsh</title>
<link rel="icon" href="data:,">
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Monaco, monospace;
  --window: #fff; --chrome: #ececef; --card: #fff; --well: #f2f2f5; --grid-bg: #e4e4e8;
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6; --sep: rgba(0,0,0,.09); --sep-strong: rgba(0,0,0,.16);
  --accent: #007aff; --accent-bg: rgba(0,122,255,.12); --green: #28a745; --orange: #e08600; --red: #ff3b30; --purple: #a347d4;
  --orange-bg: rgba(255,149,0,.14); --purple-bg: rgba(175,82,222,.13); --red-bg: rgba(255,59,48,.12); --green-bg: rgba(52,199,89,.14);
  --term: #ffffff; --term-head: #f5f5f7; --term-border: rgba(0,0,0,.12); --term-text: #1d1d1f; --term-dim: #86868b;
  --t-blue: #0058d0; --t-green: #1a7f37; --t-orange: #b35c00; --t-red: #d1242f; --t-purple: #8a3ab9; --t-cyan: #0a7590;
  --t-add-bg: rgba(26,127,55,.08); --t-del-bg: rgba(209,36,47,.08);
  --b0: #0a6cff; --b1: #1f9d55; --b2: #0f8b9a; --b3: #d6336c; --b4: #5856d6; --b5: #8e6e53;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --window: #1e1e20; --chrome: #2a2a2d; --card: #2c2c2f; --well: #252528; --grid-bg: #141416;
  --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73; --sep: rgba(255,255,255,.08); --sep-strong: rgba(255,255,255,.16);
  --accent: #0a84ff; --accent-bg: rgba(10,132,255,.18); --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2;
  --orange-bg: rgba(255,159,10,.16); --purple-bg: rgba(191,90,242,.16); --red-bg: rgba(255,69,58,.16); --green-bg: rgba(48,209,88,.16);
  --term: #1c1c1e; --term-head: #252528; --term-border: rgba(255,255,255,.08); --term-text: #e5e5ea; --term-dim: #8e8e93;
  --t-blue: #64b5ff; --t-green: #5fd97a; --t-orange: #ffb340; --t-red: #ff6b61; --t-purple: #d38cff; --t-cyan: #64d2ff;
  --t-add-bg: rgba(95,217,122,.1); --t-del-bg: rgba(255,107,97,.1);
  --b0: #4aa3ff; --b1: #3ecf74; --b2: #3cc6d4; --b3: #ff6b9a; --b4: #8e8cff; --b5: #c09a78;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --window: #1e1e20; --chrome: #2a2a2d; --card: #2c2c2f; --well: #252528; --grid-bg: #141416;
  --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73; --sep: rgba(255,255,255,.08); --sep-strong: rgba(255,255,255,.16);
  --accent: #0a84ff; --accent-bg: rgba(10,132,255,.18); --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2;
  --orange-bg: rgba(255,159,10,.16); --purple-bg: rgba(191,90,242,.16); --red-bg: rgba(255,69,58,.16); --green-bg: rgba(48,209,88,.16);
  --term: #1c1c1e; --term-head: #252528; --term-border: rgba(255,255,255,.08); --term-text: #e5e5ea; --term-dim: #8e8e93;
  --t-blue: #64b5ff; --t-green: #5fd97a; --t-orange: #ffb340; --t-red: #ff6b61; --t-purple: #d38cff; --t-cyan: #64d2ff;
  --t-add-bg: rgba(95,217,122,.1); --t-del-bg: rgba(255,107,97,.1);
  --b0: #4aa3ff; --b1: #3ecf74; --b2: #3cc6d4; --b3: #ff6b9a; --b4: #8e8cff; --b5: #c09a78;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--font); color: var(--text); background: var(--window); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
.window { height: 100%; display: flex; flex-direction: column; }

/* title bar + tabs */
.titlebar { height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; background: var(--chrome); border-bottom: .5px solid var(--sep); }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-right: 6px; white-space: nowrap; }
.brand small { font-weight: 400; color: var(--text-2); font-size: 11px; }
.mode { display: inline-flex; border: 1px solid var(--sep-strong); border-radius: 6px; overflow: hidden; font: 600 10.5px/1 var(--mono, ui-monospace, monospace); flex: none; }
.mode a { padding: 4px 7px; color: var(--text-2); text-decoration: none; }
.mode a.on { background: var(--accent); color: #fff; } .mode a.on[data-mode="live"] { background: var(--green, #1f9d55); }
.ib:disabled { opacity: .35; cursor: default; } .player .dots.locked i { cursor: default; }
.player .ev .busy { color: var(--orange); } .player .ev .err { color: var(--red); } .player .ev .ok { color: var(--green); }
.storysel { font: 500 11.5px var(--font); border: 1px solid var(--sep-strong); border-radius: 6px; background: var(--card); color: var(--text); padding: 3px 4px; flex: none; max-width: 140px; }
.tabs { display: flex; gap: 4px; align-items: center; min-width: 0; overflow-x: auto; flex: 1; scrollbar-width: none; padding: 4px 0; }
.tab { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; border-radius: 7px; cursor: pointer; color: var(--text-2); white-space: nowrap; border: 0; background: transparent; position: relative; transition: opacity .4s, background .2s; }
.tab:hover { background: var(--sep); }
.tab[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px var(--sep); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bc); flex: none; }
.tab.main .dot { border-radius: 2px; transform: rotate(45deg); background: var(--purple); }
.tab.conflict { box-shadow: 0 0 0 1.5px var(--red) !important; color: var(--red); }
.tab .avs { display: inline-flex; gap: 1px; }
.tab .pin { opacity: 0; font-size: 10px; padding: 0 2px; border-radius: 3px; }
.tab:hover .pin, .tab .pin.on { opacity: .8; }
.tab.enter { animation: grow .35s ease-out; }
.tab.more { font: 600 11px var(--mono); }
.menu { position: fixed; z-index: 60; background: var(--card); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.25), 0 0 0 .5px var(--sep-strong); padding: 4px; min-width: 160px; }
.menu button { display: flex; width: 100%; gap: 8px; align-items: center; border: 0; background: transparent; padding: 6px 8px; border-radius: 5px; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--accent-bg); }
.ib { height: 28px; min-width: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ib:hover { background: var(--sep); color: var(--text); }
.ib.on { color: var(--accent); background: var(--accent-bg); }
.ib svg { width: 15px; height: 15px; }

/* work area */
.work { flex: 1; min-height: 0; display: grid; gap: 6px; padding: 6px; background: var(--grid-bg); }
.work.mainview { grid-template-columns: minmax(240px, .9fr) minmax(300px, 1fr) minmax(320px, 1.4fr); }
.work.branchview { grid-template-columns: minmax(240px, 1fr) minmax(300px, 1.55fr) minmax(300px, 1.3fr); }
.work.branchview.wide { grid-template-columns: minmax(200px, .7fr) minmax(260px, 1fr) minmax(320px, 1.7fr); }
.work.mainview.wide { grid-template-columns: minmax(200px, .7fr) minmax(260px, .8fr) minmax(320px, 1.7fr); }
.seg { display: inline-flex; background: var(--well); border-radius: 6px; padding: 2px; gap: 2px; flex: none; }
.seg button { border: 0; background: transparent; font: 700 10px var(--mono); letter-spacing: .03em; padding: 2px 8px; border-radius: 4px; cursor: pointer; color: var(--text-2); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px var(--sep); }
.seg button.on.h { color: var(--t-purple); } .seg button.on.f { color: var(--t-green); }
.col { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
.term { display: flex; flex-direction: column; background: var(--term); border-radius: 8px; overflow: hidden; min-width: 0; min-height: 0; box-shadow: 0 0 0 1px var(--term-border); position: relative; flex: 1; transition: box-shadow .25s; }
.term.hot { box-shadow: 0 0 0 1.5px var(--accent), 0 6px 18px rgba(0,0,0,.12); }
.term.bad { box-shadow: 0 0 0 1.5px var(--red), 0 6px 18px rgba(255,59,48,.18); }
.term.enter { animation: grow .35s ease-out; }
.thead { height: 30px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--term-head); color: var(--term-text); font-size: 12px; border-bottom: 1px solid var(--term-border); white-space: nowrap; overflow: hidden; }
.thead .ttl { font: 12px var(--mono); color: var(--term-dim); overflow: hidden; text-overflow: ellipsis; }
.thead .sp { flex: 1; }
.kind { font: 700 10px var(--mono); padding: 1px 5px; border-radius: 4px; letter-spacing: .03em; flex: none; }
.kind.fs { background: var(--accent-bg); color: var(--t-blue); }
.kind.sandbox { background: var(--orange-bg); color: var(--t-orange); }
.kind.history { background: var(--purple-bg); color: var(--t-purple); }
.kind.files { background: var(--green-bg); color: var(--t-green); }
.kind.plain { background: var(--well); color: var(--text-2); }
.pill { font: 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--well); color: var(--term-dim); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.pill.warn { background: var(--red-bg); color: var(--t-red); }
.pill.run { background: var(--green-bg); color: var(--t-green); }
.agent-tag { display: inline-flex; align-items: center; gap: 4px; font: 600 11px var(--font); color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, transparent); padding: 0 6px 0 3px; border-radius: 4px; height: 17px; }
.tbody { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px 6px; font: 12px/1.6 var(--mono); color: var(--term-text); white-space: pre-wrap; word-break: break-word; }
.ln { display: block; white-space: pre-wrap; }
.ln.new { animation: fadein .35s ease-out; }
.ln .cmd { color: var(--term-text); }
.ln.dim, .ln.dim .cmd { color: var(--term-dim); }
.out { display: block; color: var(--term-dim); padding-left: 2ch; }
.out.good { color: var(--t-green); } .out.bad { color: var(--t-red); } .out.mark { color: var(--t-orange); }
.prompt { color: var(--t-blue); }
.inrow { flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 10px 7px; font: 12px var(--mono); color: var(--term-dim); border-top: 1px solid var(--term-border); }
.inrow .prompt { flex: none; white-space: nowrap; }
.inrow > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inrow .caret { width: 7px; height: 14px; background: var(--term-dim); opacity: .5; animation: blink 1.1s steps(2) infinite; }

/* main view */
.graphwrap { flex: 1; min-height: 0; overflow: auto; padding: 6px 4px; }
svg.graph { display: block; }
svg.graph text { font-family: var(--font); fill: var(--term-text); }
svg.graph .row-line { stroke: var(--term-border); stroke-dasharray: 2 4; }
svg.graph .rowband { fill: var(--accent-bg); }
svg.graph .edge { fill: none; stroke: var(--term-dim); stroke-width: 1.8; }
svg.graph .edge.main { stroke: var(--purple); stroke-width: 2.4; }
svg.graph .edge.publish { stroke: var(--purple); stroke-width: 1.5; stroke-dasharray: 4 4; }
svg.graph .edge.merge { stroke: var(--bc); stroke-width: 1.6; stroke-dasharray: 5 3; }
svg.graph .mergehead { fill: none; stroke: var(--bc); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.graph .node .shape { transform-box: fill-box; transform-origin: center; }
svg.graph .layer .shape { fill: var(--purple); }
svg.graph .commit .shape { fill: var(--bc); }
svg.graph .commit .inner { fill: var(--term); }
svg.graph .fork .shape { fill: var(--term); stroke: var(--bc); stroke-width: 2; }
svg.graph .ini { font: 700 8px var(--font); fill: #fff; }
svg.graph .mbadge circle { fill: var(--orange); stroke: var(--term); stroke-width: 1.5; }
svg.graph .mbadge.stale circle { fill: var(--red); }
svg.graph .mbadge text { fill: #fff; font: 700 8.5px var(--font); }
svg.graph .popin { animation: popin .5s .3s both cubic-bezier(.2,.9,.3,1.35); transform-box: fill-box; transform-origin: center; }
svg.graph .rt { font: 11.5px var(--mono); fill: var(--term-text); }
svg.graph .rt .dim { fill: var(--term-dim); }
svg.graph .rt .hd { font-weight: 700; fill: var(--accent); }
@keyframes popin { from { transform: scale(0); } to { transform: scale(1); } }
.rows { flex: 1; min-height: 0; overflow: auto; padding: 4px; }
.brow { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 6px; cursor: pointer; min-height: 32px; transition: background .25s; }
.brow .slot { width: 100px; height: 20px; flex: none; }
.brow .hd { font: 11px var(--mono); color: var(--text-2); width: 34px; text-align: right; flex: none; }
.brow:hover { background: var(--well); }
.brow.flash { animation: flash 1s ease-out; }
.brow .st { width: 16px; text-align: center; font-size: 12px; flex: none; }
.brow .nm { font: 600 12px var(--mono); color: var(--bc); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .meta { font: 11px var(--mono); color: var(--text-3); white-space: nowrap; }
.brow.idle .nm { opacity: .6; }
.bench { flex: none; min-height: 64px; border-top: 1px dashed var(--sep-strong); display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 11px; color: var(--text-3); position: relative; }
.bench b { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 10px; }

/* branch view */
/* SDK call details on a terminal line (tui.html) */
.sdkbtn { margin-left: 8px; font: 9.5px var(--mono); padding: 0 4px; border-radius: 3px; border: 1px solid var(--term-border); background: transparent; color: var(--term-dim); cursor: pointer; opacity: 0; vertical-align: 1px; }
.ln:hover .sdkbtn, .ln.open .sdkbtn, .sdkbtn:focus-visible { opacity: 1; }
.sdk { display: none; margin: 3px 0 5px; padding: 6px 9px; border-left: 2px solid var(--t-cyan); background: var(--well); border-radius: 0 6px 6px 0; color: var(--term-text); font-size: 11.5px; white-space: normal; }
.ln.open .sdk { display: block; }
.sdk .code { color: var(--term-dim); display: block; margin-bottom: 4px; padding: 0; }
.sdk .code b { color: var(--t-cyan); font-weight: 600; }
.sdk pre { margin: 0 0 6px; font: inherit; white-space: pre-wrap; }
.tm { margin-left: 8px; font: 9.5px var(--mono); color: var(--term-dim); vertical-align: 1px; }
.sdk .tm { margin-left: 6px; font-size: 10.5px; }
/* Store and overlay footers */
.store { flex: none; border-top: 1px solid var(--term-border); padding: 3px 10px 4px; font: 10.5px/1.6 var(--mono); color: var(--term-dim); background: var(--well); }
.store .srow { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; }
.store .srow > span:not(.sbar):not(.est) { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.store .kind { flex: none; font-weight: 600; font-size: 9px; letter-spacing: .06em; padding: 0; background: none; }
.store b { color: var(--term-text); font-weight: 600; } .store .est { margin-left: auto; flex: none; font-size: 9.5px; opacity: .8; }
.store .sbar { flex: none; display: flex; width: 44px; height: 5px; border-radius: 3px; overflow: hidden; background: var(--term-border); }
.store .sbar i { display: block; } .store .p { background: var(--t-cyan); } .store .m { background: var(--orange); }
.store .pc { color: var(--t-cyan); } .store .mc { color: var(--orange); }
/* Files pane (tui.html), stacked for the right column */
.fsel { font: 11.5px var(--mono); height: 22px; max-width: 200px; min-width: 70px; border: 1px solid var(--term-border); border-radius: 5px; background: var(--term); color: var(--term-text); padding: 0 4px; }
.sync { font-size: 11px; line-height: 1; flex: none; } .sync.live { color: var(--t-green); } .sync.pinned { color: var(--term-dim); }
.fbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--term-head); border-bottom: 1px solid var(--term-border); font-size: 11.5px; color: var(--term-dim); flex-wrap: wrap; }
.fbar .segs { display: inline-flex; background: var(--well); border-radius: 6px; padding: 2px; }
.fbar .fseg { border: 0; background: transparent; padding: 2px 9px; border-radius: 4px; cursor: pointer; font-size: 11.5px; color: var(--term-dim); }
.fbar .fseg.on { background: var(--card); color: var(--term-text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.fbar .chipb { border: 1px solid var(--term-border); background: transparent; border-radius: 10px; padding: 0 8px; height: 20px; cursor: pointer; font-size: 11px; color: var(--term-dim); }
.fbar .chipb.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.fbar .chk { display: inline-flex; gap: 4px; align-items: center; } .fbar .chk.off { opacity: .45; }
.fbar .sp { flex: 1; } .fbar .fcount { font: 11px var(--mono); } .fbar .sdkbtn { opacity: 1; margin-left: 0; }
.fsdk { margin: 0; padding: 6px 10px; background: var(--well); border-bottom: 1px solid var(--term-border); font: 11px/1.5 var(--mono); color: var(--term-text); white-space: pre-wrap; }
.fbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ftree, .flist { flex: 1; min-height: 0; overflow: auto; padding: 4px 0 10px; font: 12px/1.6 var(--mono); color: var(--term-text); }
.fhead { flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--term-head); border-bottom: 1px solid var(--term-border); font-size: 11.5px; color: var(--term-dim); min-width: 0; }
.fhead .fsel { min-width: 0; flex: 0 1 auto; } .fhead .sp { flex: 1; min-width: 4px; }
.fhead .fcount { font: 11px var(--mono); white-space: nowrap; } .fhead .sdkbtn { opacity: 1; margin-left: 0; flex: none; }
.fwide { flex: none; border: 0; background: none; color: var(--term-dim); font-size: 13px; width: 22px; height: 22px; border-radius: 5px; cursor: pointer; }
.fwide:hover, .fwide.on { background: var(--well); color: var(--term-text); }
.fsw, .fmodes { flex: none; display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px solid var(--term-border); min-width: 0; }
.fsw .segs, .fmodes .segs { display: inline-flex; background: var(--well); border-radius: 6px; padding: 2px; flex: none; }
.fsw .fseg, .fmodes .fseg { border: 0; background: transparent; padding: 2px 10px; border-radius: 4px; cursor: pointer; font-size: 11.5px; color: var(--term-dim); }
.fsw .fseg.on, .fmodes .fseg.on { background: var(--card); color: var(--term-text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.fsw .fseg b { font-weight: 600; margin-left: 2px; }
.fmodes .sp { flex: 1; } .fstat { font-size: 11px; color: var(--term-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: help; } .fstat b { color: var(--term-text); }
.fdir { padding: 6px 10px 1px; color: var(--term-dim); font-size: 11px; }
.fgroup { display: flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 10px; border-top: 1px dashed var(--term-border); color: var(--term-dim); font-size: 11.5px; cursor: pointer; white-space: nowrap; }
.fgroup:hover { background: var(--well); } .fgroup b { color: var(--term-text); font-weight: 600; } .fgroup .car { width: 10px; } .fgroup .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fb.lead { margin: 0 6px 0 0; }
.fpage { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--term-border); min-width: 0; }
.fback { flex: none; border: 0; background: var(--well); color: var(--accent); font-size: 11.5px; padding: 2px 8px; border-radius: 5px; cursor: pointer; }
.fback:hover { background: var(--accent-bg); }
.fpathx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); }
.fpathx .dir { color: var(--term-dim); } .fpathx b { color: var(--term-text); }
.frow { display: flex; align-items: center; gap: 4px; padding: 1px 8px; cursor: pointer; white-space: nowrap; }
.frow:hover { background: var(--well); } .frow.sel { background: var(--accent-bg); }
.frow.flash { animation: flash 1.2s ease-out; }
.frow .car { width: 10px; color: var(--term-dim); flex: none; } .frow .nm { overflow: hidden; text-overflow: ellipsis; }
.frow.gone .nm { text-decoration: line-through; color: var(--term-dim); }

.fsum { padding: 6px 10px; color: var(--term-dim); font-size: 11.5px; } .fsum b { color: var(--term-text); font-weight: 600; }

.frev td { padding: 3px 6px; border-bottom: 1px solid var(--term-border); white-space: nowrap; } .frev td.n, .frev th.n { text-align: right; } .frev .zero { color: var(--term-dim); }
.fempty { padding: 18px 12px; color: var(--term-dim); line-height: 1.6; }
.code { padding: 2px 0 10px; }
.cl { display: flex; white-space: pre; min-height: 18px; }
.cl .no { flex: none; width: 34px; padding-right: 8px; text-align: right; color: var(--term-dim); user-select: none; }
.cl .op { flex: none; width: 14px; color: var(--term-dim); }
.cl .tx { flex: 1; padding-right: 10px; }

.cl.del { background: var(--t-del-bg); } .cl.del .op, .cl.del .tx { color: var(--t-red); }

.bch.cont { opacity: .55; } .bch:hover { background: var(--well); }
svg.graph .node { cursor: pointer; }

.statusbar { height: 32px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--chrome); border-top: .5px solid var(--sep); overflow-x: auto; scrollbar-width: none; font-size: 11px; }
.statusbar .lbl { color: var(--text-3); white-space: nowrap; }
.statusbar .sp { flex: 1; min-width: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font: 11px var(--mono); background: var(--card); box-shadow: 0 0 0 .5px var(--sep-strong); white-space: nowrap; }
.chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.chip.closed { opacity: .5; } .chip.closed .d { background: var(--text-3); }
.chip.proc .d { background: var(--orange); animation: blink 1.2s steps(2) infinite; }

.sblist { flex: 1 1 0; min-height: 140px; }
.blist { flex: 0 1 auto; max-height: 48%; min-height: 96px; }
.blist .rows { overflow-y: auto; padding: 4px; }
.sbg { display: flex; flex-direction: column; gap: 1px; padding: 4px 2px 6px; border-radius: 6px; transition: box-shadow .15s; }

.sbh .mk { display: inline-flex; gap: 4px; align-items: center; color: var(--term-dim); font: 11px var(--font); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbh b, .sbh .ct { flex: none; white-space: nowrap; } .sbh .sp { flex: 1; } .sbh .ct { color: var(--term-dim); font-size: 10.5px; white-space: nowrap; }
.dnote { font-size: 10.5px; color: var(--t-orange); padding: 0 4px 0 17px; }
.dws { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; color: var(--term-text); font: 11px var(--mono); padding: 3px 4px 3px 15px; border-radius: 5px; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; }
.dws:hover { background: var(--well); }
.dws .at { color: var(--term-dim); }

.bchip { font: 10.5px var(--mono); padding: 0 5px; border-radius: 4px; color: var(--bc); box-shadow: inset 0 0 0 1px var(--bc); white-space: nowrap; }

button.chip { border: 0; color: inherit; cursor: pointer; }
.sbchip { border: 0; font: 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--well); color: var(--term-text); cursor: pointer; flex: none; }

.hcard .ws:hover, .hcard .ws:focus-visible { background: var(--accent-bg); outline: 0; }
.hcard .ws .d { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); flex: none; }

.hcard .cbtns { display: flex; gap: 6px; margin: 8px 4px 0; }
.hcard .cbtn { flex: 1; border: 0; border-radius: 6px; padding: 5px 6px; background: var(--well); cursor: pointer; font-size: 11.5px; color: var(--text); }

.panes { flex: 1; min-height: 0; display: grid; gap: 6px; grid-auto-rows: minmax(0, 1fr); }

/* player */
.player { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--chrome); border-top: .5px solid var(--sep); min-height: 64px; }
.player .ctl { display: flex; gap: 2px; flex: none; }

.player .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.player .cap { font-size: 13px; line-height: 1.4; min-height: 18px; }
.player .cap code { font: 12px var(--mono); background: var(--well); padding: 1px 5px; border-radius: 4px; }
.player .ev { font: 11px var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .ev b { color: var(--t-purple); font-weight: 600; } .player .ev .bad { color: var(--t-red); font-weight: 600; }

.player .dots i.done { background: var(--accent); } .player .dots i.now { background: var(--orange); }
.player select { font: 12px var(--font); color: var(--text); background: var(--well); border: 1px solid var(--sep-strong); border-radius: 6px; height: 26px; }

/* crabs */
#crabs { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
.crab { position: absolute; left: 0; top: 0; width: 42px; height: 33px; transition: transform .55s ease-in-out; }
.crab svg { width: 42px; height: 33px; display: block; overflow: visible; shape-rendering: crispEdges; transform-origin: bottom center; transition: transform .3s; }
.crab.small svg { transform: scale(.55); }
.crab { transition: transform .55s ease-in-out, opacity .3s; }
.crab.gone { opacity: 0; }
.crowd { position: absolute; left: 0; top: 0; font: 700 10.5px var(--mono); color: var(--text-2); background: var(--card); border-radius: 9px; padding: 1px 6px; box-shadow: 0 0 0 .5px var(--sep-strong), 0 2px 6px rgba(0,0,0,.15); animation: fadein .3s; }
.tab .plus { font: 600 9.5px var(--mono); color: var(--text-3); margin-left: 2px; }
.pill.roster { border: 0; cursor: pointer; } .pill.roster:hover { background: var(--accent-bg); }
.roster-menu b, .roster-menu span { white-space: nowrap; }
.roster-menu { width: 300px; max-height: 360px; overflow: auto; }
.crab .claw, .crab .leg { transform-box: fill-box; }
.crab.idle svg { animation: bob 2.4s steps(2) infinite; }
.crab.walk .leg { animation: claw .14s steps(2) infinite; } .crab.walk .leg.b { animation-delay: .07s; }
.crab.busy .claw { animation: claw .24s steps(2) infinite; } .crab.busy .claw.r { animation-delay: .12s; }
.crab .sweat, .crab .bang { display: none; }
.crab.sweat .sweat, .crab.sweat .bang { display: inline; }
.crab .name { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); font: 600 9.5px var(--font); color: var(--c); white-space: nowrap; background: color-mix(in srgb, var(--window) 80%, transparent); padding: 0 3px; border-radius: 3px; }
.crab.small .name { display: none; }
.bubble { position: fixed; z-index: 45; pointer-events: none; transform: translate(-50%, -100%); font: 600 11px var(--mono); padding: 3px 7px; border-radius: 8px; background: var(--card); color: var(--text); box-shadow: 0 4px 14px rgba(0,0,0,.2), 0 0 0 .5px var(--sep-strong); white-space: nowrap; animation: bubble 1.9s ease-out forwards; }
.bubble.good { color: var(--t-green); } .bubble.bad { color: var(--t-red); }
.block { position: fixed; z-index: 44; width: 12px; height: 12px; border-radius: 3px; pointer-events: none; transition: transform .6s cubic-bezier(.4,0,.2,1), opacity .2s .55s; box-shadow: 0 2px 8px rgba(0,0,0,.25); }

@keyframes bob { 50% { transform: translateY(-1.5px); } }
@keyframes claw { 50% { transform: translateY(-2px); } }
@keyframes blink { 50% { opacity: .1; } }
@keyframes grow { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes flash { 0% { background: var(--accent-bg); } 100% { background: transparent; } }
@keyframes bubble { 0% { opacity: 0; margin-top: 6px; } 12% { opacity: 1; margin-top: 0; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: -8px; } }

@media (max-width: 860px) {
  body { overflow: auto; }
  .window { height: auto; min-height: 100%; }

}
@media (max-width: 520px) { .bname { display: none; } .brand { margin-right: 0; } .storysel { max-width: 92px; } .mode a { padding: 4px 5px; } }
@media (prefers-reduced-motion: reduce) { .crab, .block { transition: none; } .crab svg, .crab .leg, .crab .claw { animation: none !important; } }
</style>

<div class="window">

    <select class="storysel" id="story" title="Story: the dsh design story, or a tui.html demo story played by dsh agents"><option value="dsh">dsh story</option><option value="agents">Demo · 5 agents</option><option value="tour">Demo · Tour</option><option value="conflicts">Demo · Conflicts</option><option value="merge">Demo · Commit &amp; merge</option></select>

<!-- The engine: the LayerFS SDK simulator and its shell, shared with tui.html. -->
<script src="simulation_engine/model.js"></script>
<script src="simulation_engine/files.js"></script>
<script src="simulation_engine/terminal.js"></script>
<script src="simulation_engine/backend/sim.js"></script>

<script src="demo.js"></script>
<script>
"use strict";
// ------------------------------------------------------------------ cast
const AGENTS = {
  main:     { color: "#a347d4", crown: true },
  "ui-dev": { color: "#0a6cff" },
  tester:   { color: "#1f9d55" },
};
const SCOUTS = ["#d6336c", "#0f8b9a", "#e08600", "#5856d6", "#8e6e53", "#c2255c", "#2b8a3e", "#1971c2", "#9c36b5"].map((color, i) => {
  const n = `scout-${i + 1}`; AGENTS[n] = { color }; return n;
});
const RECENT_S = 90, CAP = { row: 3, term: 3, bench: 6, chip: 1 };
const BCOL = ["--b0", "--b1", "--b2", "--b3", "--b4", "--b5"];
const FADE_S = 30, MAX_TABS = 6;
const M = window.LayerSim, FM = window.LayerFiles, { simulateShell, liveCommand, execLines, Engine } = window.LayerTerm;
// ?backend=sim (default): the simulator in this page, with a free player.
// ?backend=live: the real product through server/server.mjs (one project
// per run, every call really made), so the player only goes forward.
const LIVE = new URLSearchParams(location.search).get("backend") === "live";
// Compressed sizes are computed asynchronously and shared across rebuilds.
const PACKED = new Map(), PACKING = new Set();
let renderSoon = null;
const rerender = () => { clearTimeout(renderSoon); renderSoon = setTimeout(() => render(), 40); };
const FIXTURE = window.LAYERFS_SCENARIOS[0].steps[0].args.files;

// ------------------------------------------------------------------ story
// Each step is one agent's call. dsh runs it on the engine; every outcome
// (ids, Conflict, merges) comes from the engine, never from this script.
//   { a, call, args }   an SDK call
//   { a, sh }           a shell command in the agent's mounted Workspace
//   { a: "dsh", ... }   dsh itself: spawn agents, a burst of calls, a pause
const DSH_STORY = [
  { a: "main", call: "project.init", args: { name: "website", files: FIXTURE },
    cap: "<b>Main tab</b> = the project map: the project terminal (left), the Branch list (middle), and History or Files of main (right). Nothing is ever mounted on main." },
  { a: "main", call: "main.fork", args: { name: "feature-home" },
    cap: "The main agent forks a Branch. Branch calls land in the <b>project terminal</b>; a tab chip appears for the new Branch." },
  { a: "dsh", call: "dsh.spawn", args: { agents: ["ui-dev", "tester"] },
    cap: "dsh spawns two subagents. No scope, no assignment: they wait until they act." },
  { a: "ui-dev", call: "sandbox.mount", args: { branch: "feature-home" },
    cap: "<b>Follow</b> jumps to the Branch tab. dsh creates ui-dev's Sandbox and mounts a Workspace: a pane owned by ui-dev only." },
  { a: "ui-dev", sh: "mkdir -p app/components && echo 'export function Hero() { return <section>Hero</section>; }' > app/components/hero.tsx",
    cap: "Shell commands run in the Workspace (simulated shell). Their writes stay in the Workspace until a commit." },
  { a: "ui-dev", call: "sandbox.commit", args: { message: "add hero" },
    cap: "The commit lands on the Branch: a node in History, an A badge in Files." },
  { a: "tester", call: "sandbox.mount", args: { branch: "feature-home" },
    cap: "A second agent mounts its own Workspace on the same Branch. <b>One Branch, many agents; one Workspace, one agent.</b>" },
  { a: "main", call: "fs.read", args: { ref: "feature-home", path: "/app/page.tsx" },
    cap: "The main agent uses <code>fs</code> calls. They go to the Branch's <b>fs terminal</b> on the left, tagged by agent." },
  { a: "main", call: "fs.edit", args: { branch: "feature-home", path: "/app/page.tsx", oldText: "Hello world", newText: "Welcome back", message: "headline copy" },
    cap: "An fs write commits straight to the Branch — no mount, no pane. Both mount badges in History turn red: those Workspaces are now behind." },
  { a: "tester", sh: "sed -i 's/Hello world/Hello there/' app/page.tsx",
    cap: "Meanwhile tester edits the same line in its stale Workspace." },
  { a: "tester", call: "sandbox.commit", args: { message: "friendlier headline" },
    cap: "The engine merges three-way and finds a <b>Conflict</b>. Nothing is committed; the pane and tab chip turn red." },
  { a: "tester", sh: "cat app/page.tsx",
    cap: "The engine wrote the conflict markers into tester's Workspace." },
  { a: "tester", sh: "sed -i '/Welcome back\\|<<<<<<<\\|=======\\|>>>>>>>/d' app/page.tsx",
    cap: "tester keeps its own line and drops the markers…" },
  { a: "tester", call: "sandbox.commit", args: { message: "resolve headline" },
    cap: "…and commits on the new head." },
  { a: "ui-dev", sh: "npm ci && npm test" },
  { a: "ui-dev", sh: "npm run dev &",
    cap: "A background dev server. It shows under ui-dev's Sandbox on the main tab, and in the bottom bar on every tab." },
  { a: "ui-dev", call: "sandbox.commit", args: { message: "install deps" },
    cap: "ui-dev's Workspace is two Commits behind, but touched other files: the engine merges it cleanly and commits on the head." },
  { a: "ui-dev", call: "process.cancel", args: {},

  if (o.code === "Added") return [`→ ${r.publishedLayer.id}`, "good"];
  if (o.code === "Forked") return ["fork", ""];
  if (o.code === "Mounted") return ["mount", ""];
  if (o.code === "running") return ["● dev server", "good"];
  if (o.code === "Stopped" || last.call === "process.cancel") return ["■ stopped", ""];
  if (last.call === "sandbox.exec" && r && r.process) return ["● dev server", "good"];
  if (last.call === "sandbox.exec" && r && r.exitCode != null) return r.exitCode ? [`exit ${r.exitCode}`, "bad"] : /npm (test|run test)/.test(last.step.sh || "") ? ["✓ tests", "good"] : null;
  return null;
}

// The engine state, reshaped for the views.
function derive(W) {
  const s = W.engine.s, nodes = {};
  W.mainHead = s.main ? s.main.head : null;
  W.order = s.branchOrder.slice();
  W.initLayer = (Object.values(s.layers).find((l) => !l.parent) || {}).id;
  for (const l of Object.values(s.layers))
    nodes[l.id] = { id: l.id, kind: "layer", branch: null, parents: [l.parent, l.sourceCommit || null], t: l.slot, by: W.attrib[l.id], msg: l.sourceBranch ? `publish ${l.sourceBranch}@${l.sourceCommit}` : `init ${s.project.name}` };
  for (const name of s.branchOrder) {
    const b = s.branches[name];
    nodes["fork:" + name] = { id: "fork:" + name, kind: "fork", branch: name, parents: [b.from], t: b.slot, by: W.attrib["fork:" + name], msg: `fork ← ${b.from}` };
  }
  for (const c of Object.values(s.commits)) {
    const own = c.parent && s.commits[c.parent] && s.commits[c.parent].branch === c.branch;
    // demo commit messages already start with "<agent>: "; the label adds the agent itself
    const by = W.attrib[c.id], raw = c.message || c.via || "", msg = by && raw.startsWith(`${by}: `) ? raw.slice(by.length + 2) : raw;
    nodes[c.id] = { id: c.id, kind: "commit", branch: c.branch, parents: [own ? c.parent : "fork:" + c.branch, c.mergedFrom || null], t: c.slot, by, msg };
  }
  W.nodes = nodes;
  W.branches = {};
  s.branchOrder.forEach((name, i) => {
    const b = s.branches[name];
    W.branches[name] = { name, color: BCOL[i % BCOL.length], head: b.head || "fork:" + name, base: b.from, last: W.touched[name] ?? 0,
      published: !!b.head && Object.values(s.layers).some((l) => l.sourceBranch === name && l.sourceCommit === b.head) };
  });
  W.ws = {};
  for (const id of s.sandboxOrder) for (const p of s.sandboxes[id].wsOrder) {
    const w = s.sandboxes[id].workspaces[p], k = `${id}:${p}`, pane = W.panes[k];
    // A Workspace no dsh event mounted (live: another client of the same
    // server) has no agent to attribute it to, so it is not drawn.
    if (!w.mounted || !pane) continue;
    W.ws[k] = { id: k, agent: pane.agent, branch: w.branch, lines: pane.lines, born: pane.born, bad: W.engine.markersIn(w).length > 0, baseNode: w.baseCommit || "fork:" + w.branch, eng: w };
  }
}
// Root of every ref (main and each Branch), to find what a step changed.
function rootsOf(W) {
  const s = W.engine.s, out = {};
  if (s.main) out.main = s.layers[s.main.head].root;
  for (const b of s.branchOrder) out[b] = branchRoot(s, s.branches[b]);
  return out;
}
// Live trees load lazily: a tree not loaded yet reads as empty, so a ref only
// flashes when both of its trees are already here.
function changedPaths(W, before, after) {
  const out = {}, roots = W.engine.s.roots, loaded = (r) => !LIVE || W.engine.trees[r];
  for (const [ref, root] of Object.entries(after))
    if (before[ref] && before[ref] !== root && loaded(before[ref]) && loaded(root)) out[ref] = new Set(M.diffTrees(roots[before[ref]], roots[root]).map((d) => d.path));
  return out;
}

// Where an agent is: its last call while recent, else its mounted Workspace, else the bench.
function where(n) {
  const A = W.agents[n]; if (!A) return null;
  if (W.clock - A.lastT <= 12) return A.lastLoc;
  const w = Object.values(W.ws).find((x) => x.agent === n);
  return w ? { kind: "ws", branch: w.branch, ws: w.id } : { kind: "bench" };
}
const idle = (n) => where(n).kind === "bench";
const recentlyOn = (b) => Object.keys(W.agents).filter((n) => idle(n) && W.agents[n].lastBranch === b && W.clock - W.agents[n].lastT <= RECENT_S);
const capAvatars = (names, k = 3) => names.slice(0, k).map((n) => mascot(n, true)).join("") + (names.length > k ? `<span class="plus">+${names.length - k}</span>` : "");
const agentsOn = (b) => Object.keys(W.agents).filter((n) => { const l = where(n); return l.branch === b; });
const conflicted = (b) => Object.values(W.ws).some((w) => w.branch === b && w.bad);
const mounted = (b) => Object.values(W.ws).some((w) => w.branch === b);

// ------------------------------------------------------------------ view state
let W = fresh(), step = 0, active = "main", follow = true, playing = !LIVE, timer = null;
const pinned = {}, rightMode = {}, seenTabs = new Set(["main"]);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function visibleTabs() {
  const show = W.order.filter((b) => pinned[b] || b === active || mounted(b) || conflicted(b) || W.clock - W.branches[b].last <= FADE_S);
  show.sort((x, y) => W.branches[y].last - W.branches[x].last);
  const keep = show.slice(0, MAX_TABS);
  if (show.includes(active) && !keep.includes(active)) keep[keep.length - 1] = active;
  const hidden = W.order.filter((b) => !keep.includes(b));
  return { tabs: W.order.filter((b) => keep.includes(b)), hidden };
}

// ------------------------------------------------------------------ pixel crab (from tui.html)
function mascot(n, mini) {
  const r = AGENTS[n], O = r.color, K = "#1d1d1f", px = (x, y, w, h, f, c = "") => `<rect${c ? ` class="${c}"` : ""} x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
  const crown = r.crown ? px(4, 0, 6, 1, "#f2c94c") + px(4, -1, 1, 1, "#f2c94c") + px(6.5, -1, 1, 1, "#f2c94c") + px(9, -1, 1, 1, "#f2c94c") : "";
  const body = `${crown}${px(2, 1, 10, 6, O)}<g class="claw l">${px(0, 3, 2, 2, O)}</g><g class="claw r">${px(12, 3, 2, 2, O)}</g>${px(4, 2, 1, 2, K)}${px(9, 2, 1, 2, K)}${px(2, 5, 10, 1, "rgba(0,0,0,.28)")}${px(3, 7, 1, 2, O, "leg a")}${px(5, 7, 1, 2, O, "leg b")}${px(8, 7, 1, 2, O, "leg a")}${px(10, 7, 1, 2, O, "leg b")}`;
  if (mini) return `<svg viewBox="0 -2 14 11" width="14" height="11" style="shape-rendering:crispEdges;flex:none" aria-hidden="true">${body}</svg>`;
  return `<svg viewBox="0 -2 14 11" aria-hidden="true">${body}<g class="sweat">${px(1, 0, 1, 2, "#6cc4ff")}</g><g class="bang">${px(13, -2, 1, 2, "#e5484d")}${px(13, 1, 1, 1, "#e5484d")}</g></svg>`;
}
const tag = (n) => `<span class="agent-tag" style="--ac:${AGENTS[n].color}">${mascot(n, true)}${esc(n)}</span>`;

// ------------------------------------------------------------------ render: tabs
function renderTabs() {
  const { tabs, hidden } = visibleTabs();
  const chip = (b) => {
    const B = W.branches[b], avs = capAvatars(agentsOn(b));
    const isNew = !seenTabs.has(b); seenTabs.add(b);
    return `<button class="tab${conflicted(b) ? " conflict" : ""}${isNew ? " enter" : ""}" role="tab" data-tab="${b}" aria-selected="${b === active}" style="--bc:var(${B.color})">
      <span class="dot"></span>${esc(b)}<span class="avs">${avs}</span><span class="pin${pinned[b] ? " on" : ""}" data-pin="${b}" title="Pin tab">${pinned[b] ? "📌" : "⌖"}</span></button>`;
  };
  const histAvs = capAvatars(Object.keys(W.agents).filter((n) => where(n).kind === "hist"));
  $("tabs").innerHTML = `<button class="tab main" role="tab" data-tab="main" aria-selected="${active === "main"}"><span class="dot"></span>main<span class="avs">${histAvs}</span></button>`
    + tabs.map(chip).join("") + (hidden.length ? `<button class="tab more" data-more="1" title="${hidden.length} idle Branches">+${hidden.length}</button>` : "");
}

// ------------------------------------------------------------------ render: graph
// History in the tui.html shape, turned vertical: one column per lane (main
// first), one row per node, oldest at the top. Gray edges join a lane; a fork
// leaves its source sideways then runs down; publish and merge are dashed.
// Mounted Workspaces show as a badge on the node they are based on.
function graph(filter, activeLane) {
  const lanes = ["main", ...W.order.filter((b) => !filter || filter.has(b))];
  const rank = { fork: 0, commit: 1, layer: 2 };
  const nodes = Object.values(W.nodes).filter((n) => !n.branch || lanes.includes(n.branch)).sort((x, y) => x.t - y.t || rank[x.kind] - rank[y.kind]);
  const LW = 22, RH = 28, X0 = 16, Y0 = 18, row = {};
  nodes.forEach((n, i) => (row[n.id] = i));
  const P = (id) => ({ x: X0 + (W.nodes[id].branch ? lanes.indexOf(W.nodes[id].branch) : 0) * LW, y: Y0 + row[id] * RH });
  const TX = X0 + (lanes.length - 1) * LW + 20, H = Y0 + nodes.length * RH, Wd = TX + 250;
  const bc = (b) => (b ? `var(${W.branches[b].color})` : "var(--purple)");
  const curve = (a, b) => (Math.abs(a.x - b.x) < 1 ? `M${a.x},${a.y} L${b.x},${b.y}` : `M${a.x},${a.y} C${b.x},${a.y} ${b.x},${a.y} ${b.x},${b.y}`);
  const scurve = (a, b) => { const m = (a.y + b.y) / 2; return `M${a.x},${a.y} C${a.x},${m} ${b.x},${m} ${b.x},${b.y}`; };
  let g = "";
  // lane guides from each lane's first row, and the active lane's band
  lanes.forEach((l, i) => {
    const first = nodes.find((n) => (l === "main" ? !n.branch : n.branch === l)), x = X0 + i * LW;
    if (l === activeLane) g += `<rect class="rowband" x="${x - 11}" y="0" width="22" height="${H}" rx="5"/>`;
    if (first) g += `<line class="row-line" x1="${x}" y1="${P(first.id).y}" x2="${x}" y2="${H}"/>`;
  });
  for (const n of nodes) {
    const [p0, p1] = n.parents, has = (id) => id && row[id] !== undefined;
    if (n.kind === "layer") {
      if (has(p0)) g += `<path class="edge main" d="${curve(P(p0), P(n.id))}"/>`;
      if (has(p1)) g += `<path class="edge publish" d="${scurve(P(p1), P(n.id))}"/>`;
    } else if (has(p0)) g += `<path class="edge" d="${curve(P(p0), P(n.id))}"/>`;
    if (n.kind === "commit" && has(p1)) {
      const a = P(p1), b = P(n.id), ey = b.y - 9, ex = b.x;
      g += `<g style="--bc:${bc(W.nodes[p1].branch)}"><path class="edge merge" d="M${a.x},${a.y} C${a.x},${(a.y + ey) / 2} ${ex},${(a.y + ey) / 2} ${ex},${ey}"/><path class="mergehead" d="M${ex - 4.5},${ey - 5} L${ex},${ey} L${ex + 4.5},${ey - 5}"/></g>`;
    }
  }
  const heads = new Set([W.mainHead, ...W.order.map((b) => W.branches[b].head)]);
  for (const n of nodes) {
    const p = P(n.id), pop = W.newNodes.has(n.id) ? " popin" : "", style = `style="--bc:${bc(n.branch)}"`;
    const ms = Object.values(W.ws).filter((w) => w.baseNode === n.id);
    const badge = ms.length ? `<g class="mbadge${n.id !== W.branches[n.branch].head ? " stale" : ""}"><circle cx="${p.x + 8}" cy="${p.y - 9}" r="6.5"/><text x="${p.x + 8}" y="${p.y - 6}" text-anchor="middle">${ms.length}</text></g>` : "";
    g += n.kind === "layer" ? `<g class="node layer${pop}" data-node="${n.id}"><rect class="shape" x="${p.x - 8}" y="${p.y - 8}" width="16" height="16" rx="4"/></g>`
      : n.kind === "fork" ? `<g class="node fork${pop}" ${style} data-node="${n.id}"><circle class="shape" cx="${p.x}" cy="${p.y}" r="4.5"/>${badge}</g>`
      : `<g class="node commit${pop}" ${style} data-node="${n.id}"><circle class="shape" cx="${p.x}" cy="${p.y}" r="7.5"/>${n.parents[1] ? `<circle class="inner" cx="${p.x}" cy="${p.y}" r="2.8"/>` : `<text class="ini" x="${p.x}" y="${p.y + 3}" text-anchor="middle">${esc((n.by || "?")[0].toUpperCase())}</text>`}${badge}</g>`;
    const lane = n.branch || "main", id = n.kind === "fork" ? "fork" : n.id;
    // id · lane (implied for Layers) · agent: message
    const who = AGENTS[n.by] ? `<tspan style="fill:${AGENTS[n.by].color}" font-weight="600">${esc(n.by)}</tspan><tspan class="dim">: ${esc(n.msg || "")}</tspan>` : "";
    g += `<text class="rt" x="${TX}" y="${p.y + 4}"><tspan font-weight="600">${esc(id)}</tspan>  ${n.branch ? `<tspan style="fill:${bc(n.branch)}">${esc(lane)}</tspan>  ` : ""}${who}${heads.has(n.id) ? `<tspan class="hd"> ◂ head</tspan>` : ""}</text>`;
  }
  return `<svg class="graph" width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}">${g}</svg>`;
}

// ------------------------------------------------------------------ render: terminals
// Diagnostic timing per call (issue #329 C), as tui.html shows it: live is the
// SDK call, the server's refresh and the HTTP round trip; sim is the in-page
// model and says nothing about the product. Neither is a measurement.
const fmtMs = (ms) => (ms < 1 ? ms.toFixed(2) : ms < 1000 ? ms.toFixed(0) : (ms / 1000).toFixed(2) + " s").replace(/(\d)$/, "$1 ms").replace(/ s ms$/, " s");
function timingText(t) {
  if (!t) return "";
  if (t.simulated) return `${fmtMs(t.totalMs)} in the page (sim)`;
  if (t.reset) return `${fmtMs(t.totalMs)} · server reset: new volume + Init`;
  const http = Math.max(0, t.totalMs - (t.sdkMs || 0) - (t.refreshMs || 0));
  return `sdk ${fmtMs(t.sdkMs || 0)} · refresh ${fmtMs(t.refreshMs || 0)} · http ${fmtMs(http)}`;
}
function cmdTime(calls) {
  const ts = (calls || []).map((c) => c.timing).filter(Boolean);
  if (!ts.length) return "";
  const sum = ts.reduce((a, t) => a + (t.simulated || t.reset ? t.totalMs : t.sdkMs || 0), 0);
  return `<span class="tm" title="${ts[0].simulated ? "Time of the simulator in the page, not the product" : "SDK call time, summed over this line's calls"}">${fmtMs(sum)}${ts[0].simulated ? " sim" : ""}</span>`;
}
const OPEN_SDK = new Set();
function lineHtml(l, isNew, prefix) {
  const c = l.calls || [], key = String(l.t) + (l.text || "");
  const sdk = c.length ? `<button class="sdkbtn" data-sdk="${esc(key)}" title="Show the SDK call and inline Node script">sdk${c.length > 1 ? " ×" + c.length : ""}</button><div class="sdk">${c.map((x) => `<span class="code"><b>${esc(x.call)}</b> → ${esc(x.code)}<span class="tm">${esc(timingText(x.timing))}</span></span><pre>${esc(x.script)}</pre>`).join("")}</div>` : "";
  return `<div class="ln${l.dim ? " dim" : ""}${isNew ? " new" : ""}${OPEN_SDK.has(key) ? " open" : ""}">${prefix}${l.text ? `<span class="cmd">${esc(l.text)}</span>` : ""}${cmdTime(c)}${sdk}</div>`
    + (l.out || []).map((o) => `<span class="out${o.c ? " " + o.c : ""}${isNew ? " ln new" : ""}">${esc(o.t)}</span>`).join("");
}
const inrow = (ph) => `<div class="inrow"><span class="prompt">you ›</span><span class="caret"></span><span>${esc(ph)}</span></div>`;

// ------------------------------------------------------------------ Files (tui.html Files pane)
// One Files view per tab. The subject is the tab's Branch (or main) at its
// latest head or at one fixed point; the base is what it is compared with.
// All reads go through simulation_engine/files.js on the engine state.
const COLLAPSE = ["/node_modules", "/.git", "/.next"];
const FILES = {};
const fmtBytes = (n) => (n == null ? "not reported" : n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`);
const bytesOf = (t) => new TextEncoder().encode(t || "").length;
const ratio = (a, b) => (b > 0 ? `×${(a / b).toFixed(a / b >= 10 ? 0 : 1)}` : "–");
const bar = (p, m) => `<span class="sbar"><i class="p" style="flex:${p} 0 0"></i><i class="m" style="flex:${m} 0 0"></i></span>`;
const INODE_BYTES = 73; // one inode value row; directory entries and pooling ignored
const laneColor = (b) => (!b || b === "main" ? "var(--purple)" : W.branches[b] ? `var(${W.branches[b].color})` : "var(--text-3)");
const defaultBase = (tab) => (tab === "main" ? "" : "fork:" + tab);
// list: "changes" (grouped, against the base) or "all" (the tree); path: the
// open file (the file page) or null (the list); wide: the column takes half the window.
function filesOf(tab) { return (FILES[tab] ||= { at: "latest", base: defaultBase(tab), path: null, toggled: [], mode: "view", list: "changes", sdk: false, wide: false }); }
const subjectOf = (tab, p) => (p.at === "latest" ? tab : p.at);
function pointLabel(ref) {
  if (!ref) return "nothing";
  if (ref === "main" || W.branches[ref]) return `${ref} · latest`;
  if (ref.startsWith("fork:")) return `${ref.slice(5)} · fork point`;
  const n = W.nodes[ref];
  return n ? `${n.branch || "main"} · ${ref}` : ref;
}
function atSelect(tab, p) {
  const s = W.engine.s, o = (v, label) => `<option value="${esc(v)}"${v === p.at ? " selected" : ""}>${esc(label)}</option>`;
  const opts = tab === "main"
    ? Object.values(s.layers).sort((a, b) => b.slot - a.slot).map((l) => o(l.id, `${l.id} · ${l.sourceCommit ? "from " + l.sourceCommit : "init"}`)).join("")
    : Object.values(s.commits).filter((c) => c.branch === tab).sort((a, b) => b.slot - a.slot).map((c) => o(c.id, `${c.id} · ${c.message || c.via}`)).join("") + o("fork:" + tab, `fork point · ${s.branches[tab].from}`);
  const live = p.at === "latest";
  return `<span class="sync ${live ? "live" : "pinned"}" title="${live ? "Follows the head: new Commits show up as they land" : "Fixed at one point in history"}">${live ? "●" : "⊙"}</span><select class="fsel" data-fat="${esc(tab)}" title="What you look at: latest, or a fixed point">${o("latest", `${tab} @ ${tab === "main" ? W.mainHead : W.branches[tab].head.replace("fork:", "fork ")}`)}${opts}</select>`;
}
// What the point is compared with: parent, fork point, main, none, or a node picked in History.
function baseSelect(tab, p, subject) {
  const parent = FM.parentRef(W.engine, subject) || "", choices = [];
  if (parent) choices.push([parent, `vs parent · ${parent.replace("fork:", "fork ")}`]);
  if (tab !== "main") choices.push(["fork:" + tab, "vs fork point"], ["main", "vs main"]);
  if (p.base && !choices.some(([v]) => v === p.base)) choices.push([p.base, `vs ${pointLabel(p.base)}`]);
  choices.push(["", "no compare"]);
  return `<select class="fsel cmp" data-fbasesel="${esc(tab)}" title="What it is compared with">${choices.map(([v, l]) => `<option value="${esc(v)}"${v === p.base ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;

// Where a changed path belongs in the Changes list: dependencies and build
// output fold into one row each, so the source changes come first.
const DEPS = /^\/(node_modules\/|package-lock\.json$|yarn\.lock$|pnpm-lock\.yaml$)/, BUILD = /^\/(\.next|dist|build|out|\.turbo|coverage)\//, VCS = /^\/\.git\//;
const groupOf = (path) => (DEPS.test(path) ? "deps" : BUILD.test(path) ? "build" : VCS.test(path) ? "vcs" : "src");
function changesHtml(tab, p, sv, bv, ch, flash) {
  const files = Object.entries(ch.files).filter(([path]) => ((sv.tree[path] || bv.tree[path]) || {}).type === "file");
  if (!files.length) return `<div class="fempty">No file differences between ${esc(pointLabel(p.base))} and ${esc(pointLabel(subjectOf(tab, p)))}.</div>`;
  const row = (path, k, label, indent) => `<div class="frow${flash.has(path) ? " flash" : ""}" data-fopen="${esc(path)}" style="padding-left:${indent}px" title="${esc(path)}"><span class="fb ${k} lead">${k}</span><span class="nm">${esc(label)}</span></div>`;
  const by = { src: [], build: [], deps: [], vcs: [] };
  for (const f of files) by[groupOf(f[0])].push(f);
  // source: by folder, root files first
  const dirs = new Map();
  for (const [path, k] of by.src.sort(([a], [b]) => a.localeCompare(b))) { const d = path.slice(0, path.lastIndexOf("/") + 1); (dirs.get(d) || dirs.set(d, []).get(d)).push([path, k]); }
  let html = "";
  for (const [d, list] of [...dirs].sort(([a], [b]) => (a === "/" ? -1 : b === "/" ? 1 : a.localeCompare(b)))) {
    if (d !== "/") html += `<div class="fdir">${esc(d.slice(1))}</div>`;
    html += list.map(([path, k]) => row(path, k, path.slice(d.length), d === "/" ? 10 : 22)).join("");
  }
  const lww = sv.tree["/.lww"] ? " · .lww: newest wins" : "";
  const fold = (g, label, hint) => {
    const list = by[g]; if (!list.length) return "";
    const open = p.toggled.includes("group:" + g), roots = [...new Set(list.map(([path]) => path.split("/")[1]))].join(", ");
    return `<div class="fgroup" data-fgroup="${esc(tab)}|${g}"><span class="car">${open ? "▾" : "▸"}</span><b>${label}</b><span class="nm">${esc(roots)}</span><span class="fr">${list.length} file${list.length === 1 ? "" : "s"}${hint}</span></div>`
      + (open ? list.sort(([a], [b]) => a.localeCompare(b)).map(([path, k]) => row(path, k, path.slice(1), 22)).join("") : "");
  };

// ------------------------------------------------------------------ crabs
function crabEl(n) {

  if (!el) {
    el = document.createElement("div"); el.className = "crab idle"; el.dataset.crab = n;
    el.style.setProperty("--c", AGENTS[n].color);

// The element an agent stands on in the current tab, or null when this tab
// has nothing to say about it (idle on main, idle elsewhere on a Branch tab).
function targetOf(n) {
  const l = where(n), q = (s) => document.querySelector(`[data-loc="${s}"]`), chip = (t) => document.querySelector(`[data-tab="${t}"]`) || document.querySelector("[data-more]");
  if (l.kind === "bench") return active !== "main" && recentlyOn(active).includes(n) ? { el: q("bench"), mode: "bench" } : { el: null };
  if (active === "main") return l.kind === "hist" ? { el: q("hist"), mode: "term" } : { el: q("row:" + l.branch), mode: "row" };
  if (l.kind === "hist") return { el: chip("main"), mode: "chip" };
  if (l.branch !== active) return { el: chip(l.branch), mode: "chip" };
  return { el: q(l.kind === "ws" ? "ws:" + l.ws : "fs:" + l.branch), mode: l.kind === "ws" ? "pane" : "term" };
}
function placeCrabs() {
  const ev = STORY[step - 1], groups = new Map();
  for (const b of $("crabs").querySelectorAll(".crowd")) b.remove();
  // after a rewind, agents not spawned yet at this step have no crab
  for (const el of $("crabs").querySelectorAll(".crab")) if (!W.agents[el.dataset.crab]) el.classList.add("gone");
  // the acting agent first, so a capped host never hides the one doing the work
  const acting = new Set(ev && ev.burst ? ev.burst.map((e) => e.a) : ev ? [ev.a] : []);
  const names = Object.keys(W.agents).sort((x, y) => acting.has(y) - acting.has(x));
  for (const n of names) {
    const el = crabEl(n), t = targetOf(n);
    if (!t.el) { el.classList.add("gone"); continue; }
    if (!groups.has(t.el)) groups.set(t.el, { mode: t.mode, list: [] });
    groups.get(t.el).list.push(n);
  }
  for (const [host, { mode, list }] of groups) {
    // a Branch row's crabs stand small in its slot, so the list stays compact
    const slot = mode === "row" ? host.querySelector("[data-slot]") : null;
    const r = host.getBoundingClientRect(), sr = slot ? slot.getBoundingClientRect() : r, cap = mode === "pane" ? 1 : CAP[mode];
    list.forEach((n, k) => {
      const el = crabEl(n);
      if (k >= cap) { el.classList.add("gone"); return; }
      let x, y;
      if (mode === "chip") { x = r.right - 30; y = r.bottom - 22; }
      else if (mode === "row") { x = sr.left + k * 24 - 10; y = sr.top + sr.height / 2 - 17; }
      else if (mode === "bench") { x = r.left + 116 + k * 50; y = r.top + r.height / 2 - 24; }
      else { x = r.right - 52 - k * 46; y = r.bottom - 74; }
      el.classList.remove("gone");
      el.classList.toggle("small", mode === "chip" || mode === "row");
      const mood = Object.values(W.ws).some((w) => w.agent === n && w.bad) ? "sweat" : acting.has(n) && mode !== "bench" ? "busy" : "idle";
      el.classList.remove("idle", "busy", "sweat"); el.classList.add(mood);
      const pos = `${Math.round(x)},${Math.round(y)}`;
      if (el.dataset.pos !== pos) {
        el.dataset.pos = pos; el.style.transform = `translate(${x}px,${y}px)`;
        el.classList.add("walk"); clearTimeout(el.wt); el.wt = setTimeout(() => el.classList.remove("walk"), 560);
      }
    });
    if (list.length > cap && mode !== "chip") {
      const b = document.createElement("div"), k = cap;
      b.className = "crowd"; b.textContent = `+${list.length - cap}`;
      const x = mode === "row" ? sr.left + k * 24 + 2 : mode === "bench" ? r.left + 116 + k * 50 + 4 : r.right - 52 - k * 46 + 10;
      const y = mode === "row" ? sr.top + sr.height / 2 - 9 : mode === "bench" ? r.top + r.height / 2 - 8 : r.bottom - 58;
      b.style.transform = `translate(${x}px,${y}px)`; $("crabs").appendChild(b);
    }
  }
}

  setTimeout(() => {

function flyBlock(n, nodeId, color) {

// ------------------------------------------------------------------ player
// Steps run one at a time (live calls take real time). Sim rewinds by
// replaying from a fresh engine; live has one real project, so it only steps
// forward, and Restart begins a new project at step 1.
let queue = Promise.resolve(), running = null, failed = null;
async function rebuild(to) { const w = fresh(); for (let i = 0; i < to; i++) await runStep(w, STORY[i]); return w; }
function goto(i, animate) {
  const job = queue.then(() => gotoNow(i, animate));
  queue = job.catch(() => {});
  return job;
}
async function gotoNow(i, animate) {
  i = Math.max(0, Math.min(STORY.length, i));
  if (LIVE && i !== 0 && i !== step && i !== step + 1) return;
  failed = null;
  try {
    if (i === step + 1) { running = STORY[step]; renderPlayer(); await runStep(W, STORY[step]); }
    else if (i !== step || !LIVE) W = await rebuild(i);
  } catch (e) {
    running = null; failed = e.message;
    setPlaying(false); render(); renderPlayer(); throw e;
  }
  running = null;
  step = i;
  const ev = STORY[step - 1];
  lastLoc = null;
  if (ev && ev.a !== "dsh") { const l = where(ev.a); lastLoc = l.kind === "ws" ? "ws:" + l.ws : l.kind === "fs" ? "fs:" + l.branch : l.kind === "hist" ? "hist" : null; }
  if (follow && ev && ev.call !== "dsh.spawn") active = W.lastTab || "main";
  render(); renderPlayer();
  if (animate && ev && ev.a !== "dsh" && W.last) {
    const b = bubbleOf(W.last);
    if (b) bubbleOn(ev.a, b[0], b[1]);
    const id = W.last.node;
    if (id && W.nodes[id]) flyBlock(ev.a, id, W.nodes[id].branch ? css(W.branches[W.nodes[id].branch].color) : css("--purple"));
  }
}
function renderPlayer() {
  const ev = STORY[step - 1];
  for (const a of document.querySelectorAll("#mode a")) a.classList.toggle("on", (a.dataset.mode === "live") === LIVE);
  $("p-prev").disabled = LIVE; $("p-dots").classList.toggle("locked", LIVE);
  $("p-reset").title = LIVE ? "New project: restart the story on a fresh volume" : "Restart";
  $("p-count").textContent = `${step}/${STORY.length}`;
  let cap = ""; for (let i = step - 1; i >= 0 && !cap; i--) if (STORY[i].cap) cap = STORY[i].cap;
  $("p-cap").innerHTML = cap || "Press ▶ to play the story, or step with ← →.";
  const shown = (st) => st.label ? st.label : st.sh ? `sandbox.exec ${JSON.stringify({ command: st.sh })}` : `${st.call} ${JSON.stringify(Object.fromEntries(Object.entries(st.args || {}).filter(([k]) => !["files", "content", "agents"].includes(k))))}`;
  $("p-ev").innerHTML = ev && ev.burst ? `events · <b>×${ev.burst.length}</b> ${esc([...new Set(ev.burst.map((e) => e.call))].join(", "))} from ${ev.burst.length} agents`
    : ev && ev.a !== "dsh" ? `event · <b>${esc(ev.a)}</b> ${esc(shown(ev))}${W.last ? ` → <span class="${W.last.o.ok ? "" : "bad"}">${esc(W.last.o.code)}</span>` : ""}`
    : ev ? `dsh · ${esc(ev.label || ev.call.slice(4))}` : "event · —";
  // demo stories: the step's outcome against what demo.js expects
  if (W.check) $("p-ev").innerHTML += W.check.ok ? ` <span class="ok" title="demo.js expects ${esc(W.check.expect)}">✓ as expected</span>` : ` <span class="err">✕ expected ${esc(W.check.expect)}, got ${esc(W.check.code)}</span>`;
  if (running) $("p-ev").innerHTML = `<span class="busy">running ${esc(running.a)} · ${esc(running.label || (running.sh ? "sandbox.exec " + running.sh : running.call))}…</span>`;
  if (failed) $("p-ev").innerHTML = `<span class="err">✕ ${esc(failed)}</span>`;
  $("p-dots").innerHTML = STORY.map((_, i) => `<i class="${i < step - 1 ? "done" : i === step - 1 ? "now" : ""}" data-step="${i + 1}" title="step ${i + 1}"></i>`).join("");
  $("p-play").textContent = playing ? "❚❚" : "▶";
}
async function tick() {
  clearTimeout(timer);
  if (!playing) return;
  if (step >= STORY.length) { playing = false; renderPlayer(); return; }
  const t0 = performance.now();
  try { await goto(step + 1, true); } catch (e) { console.error(e); setPlaying(false); return; }
  const ms = 2300 * (STORY[step - 1].w ?? 1) / (DEMO && DEMO.speed ? DEMO.speed : 1) / +$("p-speed").value;

// A failed step is shown in the player (gotoNow), so handlers drop the rejection.

  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; render();
};
// Files controls, and History nodes that open Files at that point.
function filesClick(e) {
  const t = e.target, at = (sel) => t.closest(sel);
  const tabOfPane = () => active;
  let el;
  if ((el = at("[data-fmode]"))) { const [tab, m] = el.dataset.fmode.split("|"); filesOf(tab).mode = m; render(); return true; }
  if ((el = at("[data-flist]"))) { const [tab, v] = el.dataset.flist.split("|"); filesOf(tab).list = v; render(); return true; }
  if ((el = at("[data-fback]"))) { filesOf(el.dataset.fback).path = null; render(); return true; }
  if ((el = at("[data-fwide]"))) { const p = filesOf(el.dataset.fwide); p.wide = !p.wide; render(); return true; }
  if ((el = at("[data-fgroup]"))) { const [tab, g] = el.dataset.fgroup.split("|"), p = filesOf(tab), key = "group:" + g; p.toggled = p.toggled.includes(key) ? p.toggled.filter((x) => x !== key) : [...p.toggled, key]; render(); return true; }
  if ((el = at("[data-fsdk]"))) { const p = filesOf(el.dataset.fsdk); p.sdk = !p.sdk; render(); return true; }
  if ((el = at("[data-ftree]"))) {
    const p = filesOf(tabOfPane()), path = el.dataset.ftree;
    if (el.dataset.ftype === "dir") { p.toggled = p.toggled.includes(path) ? p.toggled.filter((x) => x !== path) : [...p.toggled, path]; }
    else openFile(p, path);
    render(); return true;
  }
  if ((el = at("[data-fopen]"))) { openFile(filesOf(tabOfPane()), el.dataset.fopen); render(); return true; }
  if ((el = at("[data-fblame]"))) { const p = filesOf(tabOfPane()), id = el.dataset.fblame; showPoint(tabOfPane(), id); p.mode = "diff"; render(); return true; }
  if ((el = at("svg.graph [data-node]"))) { showPoint(tabOfPane(), el.dataset.node); render(); return true; }
  return false;
}
// Opening a file shows what changed when it changed, else the file.
function openFile(p, path) {
  const sv = FM.resolveRef(W.engine, subjectOf(active, p)), bv = p.base ? FM.resolveRef(W.engine, p.base) : null;
  const changed = sv && bv && FM.changeMap(sv.tree, bv.tree).files[path];
  p.path = path; p.mode = changed ? "diff" : "view";
}
// Points Files at one node: on this tab's lane it pins the subject there; any
// other node becomes the subject's base. The base defaults to its parent.
function showPoint(tab, id) {
  const p = filesOf(tab), n = W.nodes[id]; if (!n) return;
  const lane = n.branch || "main";
  if (lane === tab) { p.at = n.kind === "fork" ? "fork:" + tab : id; p.base = FM.parentRef(W.engine, p.at) || ""; }
  else p.base = n.kind === "fork" ? id : id;
  rightMode[tab] = "files";
}
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.fat) { const p = filesOf(t.dataset.fat); p.at = t.value; p.base = p.at === "latest" ? defaultBase(t.dataset.fat) : FM.parentRef(W.engine, p.at) || ""; render(); }
  else if (t.dataset.fbasesel !== undefined) { filesOf(t.dataset.fbasesel).base = t.value; render(); }
});
function closeMenu() { const m = document.querySelector(".menu"); if (m) m.remove(); }
$("tabs").onclick = (e) => {
  closeMenu();
  const pin = e.target.closest("[data-pin]");
  if (pin) { const b = pin.dataset.pin; pinned[b] = !pinned[b]; e.stopPropagation(); render(); return; }
  const more = e.target.closest("[data-more]");
  if (more) {
    const r = more.getBoundingClientRect(), m = document.createElement("div");
    m.className = "menu"; m.style.left = r.left + "px"; m.style.top = r.bottom + 4 + "px";
    m.innerHTML = visibleTabs().hidden.map((b) => `<button data-open="${b}"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(${W.branches[b].color})"></span>${esc(b)}</button>`).join("");
    document.body.appendChild(m); return;
  }
  const t = e.target.closest("[data-tab]");
  if (t) { active = t.dataset.tab; follow = false; $("follow").classList.remove("on"); render(); }
};
// Sandboxes: open a Workspace's Branch at its pane, or show a pane's Sandbox on main.
let focusPane = null;
document.addEventListener("click", (e) => {
  const t = e.target.closest && e.target.closest("[data-dws], [data-sbchip]");
  if (!t) return;
  e.stopImmediatePropagation();
  // a pane's or a process's Sandbox chip: show that Sandbox on the main tab
  if (t.dataset.sbchip) { active = "main"; follow = false; $("follow").classList.remove("on"); sbPulse = t.dataset.sbchip; render(); return; }
  const k = t.dataset.dws, w = W.ws[k] || null, branch = w ? w.branch : null;
  if (!branch) return;
  active = branch; follow = false; $("follow").classList.remove("on"); focusPane = k; render(); focusPane = null;
  document.querySelector(`[data-loc="ws:${CSS.escape(k)}"]`)?.scrollIntoView({ block: "nearest" });
}, true);
document.addEventListener("click", (e) => {
  const sd = e.target.closest("[data-sdk]");
  if (sd) { const k = sd.dataset.sdk; OPEN_SDK.has(k) ? OPEN_SDK.delete(k) : OPEN_SDK.add(k); render(); return; }
  if (filesClick(e)) return;
  const ro = e.target.closest("[data-roster]");
  if (ro) { closeMenu(); rosterMenu(ro); return; }
  const r = e.target.closest("[data-right]");
  if (r) { const [t, m] = r.dataset.right.split(":"); rightMode[t] = m; render(); return; }
  const o = e.target.closest("[data-open]");
  if (o) { active = o.dataset.open; follow = false; $("follow").classList.remove("on"); closeMenu(); render(); }
  else if (!e.target.closest("[data-more]") && !e.target.closest(".menu")) closeMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); $("p-play").click(); }
  else if (e.key === "ArrowRight") $("p-next").click();
  else if (e.key === "ArrowLeft") $("p-prev").click();
  else if (e.key === "f" || e.key === "F") $("follow").click();
});
addEventListener("resize", () => placeCrabs());
// Narrow layouts scroll the page or a column: crabs stay with their hosts.
addEventListener("scroll", () => placeCrabs(), { capture: true, passive: true });

// Live: a process that exits on its own (or a Workspace changed outside a
// call) shows up through the server's state poll.
if (LIVE) setInterval(async () => {
  if (running || !W.engine.s.project) return;
  try { if (await W.engine.poll()) { derive(W); render(); } } catch { /* the server may be resetting */ }
}, 3000);
go(0).then(() => { renderPlayer(); if (!LIVE) setPlaying(true); });
</script>
