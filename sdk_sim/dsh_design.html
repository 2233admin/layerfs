<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>LayerFS × dsh</title>

<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Monaco, monospace;
  --window: #fff; --chrome: #ececef; --card: #fff; --well: #f2f2f5; --grid-bg: #e4e4e8;
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6; --sep: rgba(0,0,0,.09); --sep-strong: rgba(0,0,0,.16);
  --accent: #007aff; --accent-bg: rgba(0,122,255,.12); --green: #28a745; --orange: #e08600; --red: #ff3b30; --purple: #a347d4;
  --orange-bg: rgba(255,149,0,.14); --purple-bg: rgba(175,82,222,.13); --red-bg: rgba(255,59,48,.12); --green-bg: rgba(52,199,89,.14);
  --term: #ffffff; --term-head: #f5f5f7; --term-border: rgba(0,0,0,.12); --term-text: #1d1d1f; --term-dim: #86868b;
  --t-blue: #0058d0; --t-green: #1a7f37; --t-orange: #b35c00; --t-red: #d1242f; --t-purple: #8a3ab9; --t-cyan: #0a7590;
  --t-add-bg: rgba(26,127,55,.08); --t-del-bg: rgba(209,36,47,.08);
  --b0: #0a6cff; --b1: #1f9d55; --b2: #0f8b9a; --b3: #d6336c; --b4: #5856d6; --b5: #8e6e53;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --window: #1e1e20; --chrome: #2a2a2d; --card: #2c2c2f; --well: #252528; --grid-bg: #141416;
  --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73; --sep: rgba(255,255,255,.08); --sep-strong: rgba(255,255,255,.16);
  --accent: #0a84ff; --accent-bg: rgba(10,132,255,.18); --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2;
  --orange-bg: rgba(255,159,10,.16); --purple-bg: rgba(191,90,242,.16); --red-bg: rgba(255,69,58,.16); --green-bg: rgba(48,209,88,.16);
  --term: #1c1c1e; --term-head: #252528; --term-border: rgba(255,255,255,.08); --term-text: #e5e5ea; --term-dim: #8e8e93;
  --t-blue: #64b5ff; --t-green: #5fd97a; --t-orange: #ffb340; --t-red: #ff6b61; --t-purple: #d38cff; --t-cyan: #64d2ff;
  --t-add-bg: rgba(95,217,122,.1); --t-del-bg: rgba(255,107,97,.1);
  --b0: #4aa3ff; --b1: #3ecf74; --b2: #3cc6d4; --b3: #ff6b9a; --b4: #8e8cff; --b5: #c09a78;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --window: #1e1e20; --chrome: #2a2a2d; --card: #2c2c2f; --well: #252528; --grid-bg: #141416;
  --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73; --sep: rgba(255,255,255,.08); --sep-strong: rgba(255,255,255,.16);
  --accent: #0a84ff; --accent-bg: rgba(10,132,255,.18); --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2;
  --orange-bg: rgba(255,159,10,.16); --purple-bg: rgba(191,90,242,.16); --red-bg: rgba(255,69,58,.16); --green-bg: rgba(48,209,88,.16);
  --term: #1c1c1e; --term-head: #252528; --term-border: rgba(255,255,255,.08); --term-text: #e5e5ea; --term-dim: #8e8e93;
  --t-blue: #64b5ff; --t-green: #5fd97a; --t-orange: #ffb340; --t-red: #ff6b61; --t-purple: #d38cff; --t-cyan: #64d2ff;
  --t-add-bg: rgba(95,217,122,.1); --t-del-bg: rgba(255,107,97,.1);
  --b0: #4aa3ff; --b1: #3ecf74; --b2: #3cc6d4; --b3: #ff6b9a; --b4: #8e8cff; --b5: #c09a78;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--font); color: var(--text); background: var(--window); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
.window { height: 100%; display: flex; flex-direction: column; }

/* title bar + tabs */
.titlebar { height: 46px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; background: var(--chrome); border-bottom: .5px solid var(--sep); }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-right: 6px; white-space: nowrap; }
.brand small { font-weight: 400; color: var(--text-2); font-size: 11px; }
.tabs { display: flex; gap: 4px; align-items: center; min-width: 0; overflow-x: auto; flex: 1; scrollbar-width: none; padding: 4px 0; }
.tab { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; border-radius: 7px; cursor: pointer; color: var(--text-2); white-space: nowrap; border: 0; background: transparent; position: relative; transition: opacity .4s, background .2s; }
.tab:hover { background: var(--sep); }
.tab[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px var(--sep); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bc); flex: none; }
.tab.main .dot { border-radius: 2px; transform: rotate(45deg); background: var(--purple); }
.tab.conflict { box-shadow: 0 0 0 1.5px var(--red) !important; color: var(--red); }
.tab .avs { display: inline-flex; gap: 1px; }
.tab .pin { opacity: 0; font-size: 10px; padding: 0 2px; border-radius: 3px; }
.tab:hover .pin, .tab .pin.on { opacity: .8; }
.tab.enter { animation: grow .35s ease-out; }
.tab.more { font: 600 11px var(--mono); }
.menu { position: fixed; z-index: 60; background: var(--card); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.25), 0 0 0 .5px var(--sep-strong); padding: 4px; min-width: 160px; }
.menu button { display: flex; width: 100%; gap: 8px; align-items: center; border: 0; background: transparent; padding: 6px 8px; border-radius: 5px; cursor: pointer; text-align: left; }
.menu button:hover { background: var(--accent-bg); }
.ib { height: 28px; min-width: 28px; padding: 0 9px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ib:hover { background: var(--sep); color: var(--text); }
.ib.on { color: var(--accent); background: var(--accent-bg); }
.ib svg { width: 15px; height: 15px; }

/* work area */
.work { flex: 1; min-height: 0; display: grid; gap: 6px; padding: 6px; background: var(--grid-bg); }
.work.mainview { grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.3fr) minmax(280px, 1fr); }
.work.branchview { grid-template-columns: minmax(260px, 1fr) minmax(320px, 1.8fr) minmax(280px, 1fr); }
.seg { display: inline-flex; background: var(--well); border-radius: 6px; padding: 2px; gap: 2px; flex: none; }
.seg button { border: 0; background: transparent; font: 700 10px var(--mono); letter-spacing: .03em; padding: 2px 8px; border-radius: 4px; cursor: pointer; color: var(--text-2); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px var(--sep); }
.seg button.on.h { color: var(--t-purple); } .seg button.on.f { color: var(--t-green); }
.col { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
.term { display: flex; flex-direction: column; background: var(--term); border-radius: 8px; overflow: hidden; min-width: 0; min-height: 0; box-shadow: 0 0 0 1px var(--term-border); position: relative; flex: 1; transition: box-shadow .25s; }
.term.hot { box-shadow: 0 0 0 1.5px var(--accent), 0 6px 18px rgba(0,0,0,.12); }
.term.bad { box-shadow: 0 0 0 1.5px var(--red), 0 6px 18px rgba(255,59,48,.18); }
.term.enter { animation: grow .35s ease-out; }
.thead { height: 30px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--term-head); color: var(--term-text); font-size: 12px; border-bottom: 1px solid var(--term-border); white-space: nowrap; overflow: hidden; }
.thead .ttl { font: 12px var(--mono); color: var(--term-dim); overflow: hidden; text-overflow: ellipsis; }
.thead .sp { flex: 1; }
.kind { font: 700 10px var(--mono); padding: 1px 5px; border-radius: 4px; letter-spacing: .03em; flex: none; }
.kind.fs { background: var(--accent-bg); color: var(--t-blue); }
.kind.sandbox { background: var(--orange-bg); color: var(--t-orange); }
.kind.history { background: var(--purple-bg); color: var(--t-purple); }
.kind.files { background: var(--green-bg); color: var(--t-green); }
.kind.plain { background: var(--well); color: var(--text-2); }
.pill { font: 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--well); color: var(--term-dim); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.pill.warn { background: var(--red-bg); color: var(--t-red); }
.pill.run { background: var(--green-bg); color: var(--t-green); }
.agent-tag { display: inline-flex; align-items: center; gap: 4px; font: 600 11px var(--font); color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, transparent); padding: 0 6px 0 3px; border-radius: 4px; height: 17px; }
.tbody { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px 6px; font: 12px/1.6 var(--mono); color: var(--term-text); white-space: pre-wrap; word-break: break-word; }
.ln { display: block; white-space: pre-wrap; }
.ln.new { animation: fadein .35s ease-out; }
.ln .cmd { color: var(--term-text); }
.ln.dim, .ln.dim .cmd { color: var(--term-dim); }
.out { display: block; color: var(--term-dim); padding-left: 2ch; }
.out.good { color: var(--t-green); } .out.bad { color: var(--t-red); } .out.mark { color: var(--t-orange); }
.prompt { color: var(--t-blue); }
.inrow { flex: none; display: flex; align-items: center; gap: 6px; padding: 5px 10px 7px; font: 12px var(--mono); color: var(--term-dim); border-top: 1px solid var(--term-border); }
.inrow .caret { width: 7px; height: 14px; background: var(--term-dim); opacity: .5; animation: blink 1.1s steps(2) infinite; }

/* main view */
.graphwrap { flex: 1; min-height: 0; overflow: auto; padding: 6px 4px; }
svg.graph { display: block; }
svg.graph text { font-family: var(--font); fill: var(--term-text); }
svg.graph .row-line { stroke: var(--term-border); stroke-dasharray: 2 4; }
svg.graph .rowband { fill: var(--accent-bg); }
svg.graph .edge { fill: none; stroke: var(--term-dim); stroke-width: 1.8; }
svg.graph .edge.main { stroke: var(--purple); stroke-width: 2.4; }
svg.graph .edge.publish { stroke: var(--purple); stroke-width: 1.5; stroke-dasharray: 4 4; }
svg.graph .edge.merge { stroke: var(--bc); stroke-width: 1.6; stroke-dasharray: 5 3; }
svg.graph .mergehead { fill: none; stroke: var(--bc); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.graph .node .shape { transform-box: fill-box; transform-origin: center; }
svg.graph .layer .shape { fill: var(--purple); }
svg.graph .commit .shape { fill: var(--bc); }
svg.graph .commit .inner { fill: var(--term); }
svg.graph .fork .shape { fill: var(--term); stroke: var(--bc); stroke-width: 2; }
svg.graph .ini { font: 700 8px var(--font); fill: #fff; }
svg.graph .mbadge circle { fill: var(--orange); stroke: var(--term); stroke-width: 1.5; }
svg.graph .mbadge.stale circle { fill: var(--red); }
svg.graph .mbadge text { fill: #fff; font: 700 8.5px var(--font); }
svg.graph .popin { animation: popin .5s .3s both cubic-bezier(.2,.9,.3,1.35); transform-box: fill-box; transform-origin: center; }
svg.graph .rt { font: 11.5px var(--mono); fill: var(--term-text); }
svg.graph .rt .dim { fill: var(--term-dim); }
svg.graph .rt .hd { font-weight: 700; fill: var(--accent); }
@keyframes popin { from { transform: scale(0); } to { transform: scale(1); } }
.rows { flex: 1; min-height: 0; overflow: auto; padding: 4px; }
.brow { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 6px; cursor: pointer; min-height: 46px; transition: background .25s; }
.brow:hover { background: var(--well); }
.brow.flash { animation: flash 1s ease-out; }
.brow .st { width: 16px; text-align: center; font-size: 12px; flex: none; }
.brow .nm { font: 600 12px var(--mono); color: var(--bc); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .meta { font: 11px var(--mono); color: var(--text-3); white-space: nowrap; }
.brow.idle .nm { opacity: .6; }
.bench { flex: none; min-height: 64px; border-top: 1px dashed var(--sep-strong); display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 11px; color: var(--text-3); position: relative; }
.bench b { font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 10px; }

/* branch view */
/* SDK call details on a terminal line (tui.html) */
.sdkbtn { margin-left: 8px; font: 9.5px var(--mono); padding: 0 4px; border-radius: 3px; border: 1px solid var(--term-border); background: transparent; color: var(--term-dim); cursor: pointer; opacity: 0; vertical-align: 1px; }
.ln:hover .sdkbtn, .ln.open .sdkbtn, .sdkbtn:focus-visible { opacity: 1; }
.sdk { display: none; margin: 3px 0 5px; padding: 6px 9px; border-left: 2px solid var(--t-cyan); background: var(--well); border-radius: 0 6px 6px 0; color: var(--term-text); font-size: 11.5px; white-space: normal; }
.ln.open .sdk { display: block; }
.sdk .code { color: var(--term-dim); display: block; margin-bottom: 4px; padding: 0; }
.sdk .code b { color: var(--t-cyan); font-weight: 600; }
.sdk pre { margin: 0 0 6px; font: inherit; white-space: pre-wrap; }
.tm { margin-left: 8px; font: 9.5px var(--mono); color: var(--term-dim); vertical-align: 1px; }
.sdk .tm { margin-left: 6px; font-size: 10.5px; }
/* Store and overlay footers */
.store { flex: none; border-top: 1px solid var(--term-border); padding: 3px 10px 4px; font: 10.5px/1.6 var(--mono); color: var(--term-dim); background: var(--well); }
.store .srow { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; }
.store .srow > span:not(.sbar):not(.est) { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.store .kind { flex: none; font-weight: 600; font-size: 9px; letter-spacing: .06em; padding: 0; background: none; }
.store b { color: var(--term-text); font-weight: 600; } .store .est { margin-left: auto; flex: none; font-size: 9.5px; opacity: .8; }
.store .sbar { flex: none; display: flex; width: 44px; height: 5px; border-radius: 3px; overflow: hidden; background: var(--term-border); }
.store .sbar i { display: block; } .store .p { background: var(--t-cyan); } .store .m { background: var(--orange); }
.store .pc { color: var(--t-cyan); } .store .mc { color: var(--orange); }
/* Files pane (tui.html), stacked for the right column */
.fsel { font: 11.5px var(--mono); height: 22px; max-width: 200px; min-width: 70px; border: 1px solid var(--term-border); border-radius: 5px; background: var(--term); color: var(--term-text); padding: 0 4px; }
.sync { font-size: 11px; line-height: 1; flex: none; } .sync.live { color: var(--t-green); } .sync.pinned { color: var(--term-dim); }
.fbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--term-head); border-bottom: 1px solid var(--term-border); font-size: 11.5px; color: var(--term-dim); flex-wrap: wrap; }
.fbar .segs { display: inline-flex; background: var(--well); border-radius: 6px; padding: 2px; }
.fbar .fseg { border: 0; background: transparent; padding: 2px 9px; border-radius: 4px; cursor: pointer; font-size: 11.5px; color: var(--term-dim); }
.fbar .fseg.on { background: var(--card); color: var(--term-text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.fbar .chipb { border: 1px solid var(--term-border); background: transparent; border-radius: 10px; padding: 0 8px; height: 20px; cursor: pointer; font-size: 11px; color: var(--term-dim); }
.fbar .chipb.on { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.fbar .chk { display: inline-flex; gap: 4px; align-items: center; } .fbar .chk.off { opacity: .45; }
.fbar .sp { flex: 1; } .fbar .fcount { font: 11px var(--mono); } .fbar .sdkbtn { opacity: 1; margin-left: 0; }
.fsdk { margin: 0; padding: 6px 10px; background: var(--well); border-bottom: 1px solid var(--term-border); font: 11px/1.5 var(--mono); color: var(--term-text); white-space: pre-wrap; }
.fbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ftree { flex: none; max-height: 40%; overflow: auto; border-bottom: 1px solid var(--term-border); padding: 4px 0; font: 12px/1.5 var(--mono); color: var(--term-text); }
.frow { display: flex; align-items: center; gap: 4px; padding: 1px 8px; cursor: pointer; white-space: nowrap; }
.frow:hover { background: var(--well); } .frow.sel { background: var(--accent-bg); }
.frow.flash { animation: flash 1.2s ease-out; }
.frow .car { width: 10px; color: var(--term-dim); flex: none; } .frow .nm { overflow: hidden; text-overflow: ellipsis; }
.frow.gone .nm { text-decoration: line-through; color: var(--term-dim); }
.frow.flat { padding: 2px 10px; font: 12px var(--mono); }
.fb { font: 700 9.5px var(--mono); padding: 0 4px; border-radius: 3px; margin-left: auto; flex: none; }
.frow.flat .fb { margin: 0 6px 0 0; }
.fb.A { color: var(--t-green); background: var(--t-add-bg); } .fb.M { color: var(--t-blue); background: var(--accent-bg); } .fb.D { color: var(--t-red); background: var(--t-del-bg); }
.fr { margin-left: auto; font: 10px var(--mono); color: var(--term-dim); flex: none; }
.fview { flex: 1; min-height: 0; overflow: auto; font: 12px/1.55 var(--mono); color: var(--term-text); }
.fpath { position: sticky; top: 0; z-index: 1; background: var(--term); padding: 5px 10px; border-bottom: 1px solid var(--term-border); font-weight: 600; }
.fpath span { font-weight: 400; color: var(--term-dim); }
.fsum { padding: 6px 10px; color: var(--term-dim); font-size: 11.5px; } .fsum b { color: var(--term-text); font-weight: 600; }
.fstats { display: flex; flex-wrap: wrap; gap: 3px 14px; padding: 6px 10px; border-bottom: 1px solid var(--term-border); background: var(--well); font-size: 11px; color: var(--term-dim); }
.fstats b { color: var(--term-text); font-weight: 600; } .fstats .est { margin-left: auto; }
.frev { width: 100%; border-collapse: collapse; font-size: 11.5px; } .frev th { text-align: left; font-weight: 600; color: var(--term-dim); padding: 4px 6px; border-bottom: 1px solid var(--term-border); }
.frev td { padding: 3px 6px; border-bottom: 1px solid var(--term-border); white-space: nowrap; } .frev td.n, .frev th.n { text-align: right; } .frev .zero { color: var(--term-dim); }
.fempty { padding: 18px 12px; color: var(--term-dim); line-height: 1.6; }
.code { padding: 2px 0 10px; }
.cl { display: flex; white-space: pre; min-height: 18px; }
.cl .no { flex: none; width: 34px; padding-right: 8px; text-align: right; color: var(--term-dim); user-select: none; }
.cl .op { flex: none; width: 14px; color: var(--term-dim); }
.cl .tx { flex: 1; padding-right: 10px; }
.cl.add { background: var(--t-add-bg); } .cl.add .op, .cl.add .tx { color: var(--t-green); }
.cl.del { background: var(--t-del-bg); } .cl.del .op, .cl.del .tx { color: var(--t-red); }
.bch { flex: none; width: 40px; margin: 0 4px 0 6px; font: 600 10.5px/18px var(--mono); color: var(--bc); border-left: 3px solid var(--bc); padding-left: 5px; cursor: pointer; }
.bch.cont { opacity: .55; } .bch:hover { background: var(--well); }
svg.graph .node { cursor: pointer; }
/* Sandbox / process status bar (tui.html) */
.statusbar { height: 32px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--chrome); border-top: .5px solid var(--sep); overflow-x: auto; scrollbar-width: none; font-size: 11px; }
.statusbar .lbl { color: var(--text-3); white-space: nowrap; }
.statusbar .sp { flex: 1; min-width: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font: 11px var(--mono); background: var(--card); box-shadow: 0 0 0 .5px var(--sep-strong); white-space: nowrap; }
.chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.chip.closed { opacity: .5; } .chip.closed .d { background: var(--text-3); }
.chip.proc .d { background: var(--orange); animation: blink 1.2s steps(2) infinite; }
.chip.enter { animation: grow .3s ease-out; }
/* Hover card on History nodes (tui.html) */
.hcard { position: fixed; z-index: 65; width: 290px; background: var(--card); border-radius: 10px; box-shadow: 0 14px 44px rgba(0,0,0,.24), 0 0 0 .5px var(--sep-strong); padding: 8px; display: none; font-size: 12px; }
.hcard.open { display: block; animation: grow .12s ease-out; }
.hcard .h { display: flex; align-items: baseline; gap: 6px; margin: 0 4px 2px; }
.hcard .h b { font: 600 13px var(--mono); }

.hcard .ws.stale small { color: var(--red); }
.hcard .cbtns { display: flex; gap: 6px; margin: 8px 4px 0; }
.hcard .cbtn { flex: 1; border: 0; border-radius: 6px; padding: 5px 6px; background: var(--well); cursor: pointer; font-size: 11.5px; color: var(--text); }

.panes { flex: 1; min-height: 0; display: grid; gap: 6px; grid-auto-rows: minmax(0, 1fr); }
.empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text-2); background: var(--term); border-radius: 8px; box-shadow: 0 0 0 1px var(--term-border); padding: 16px; }

.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bc); margin-right: 4px; }

/* player */
.player { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--chrome); border-top: .5px solid var(--sep); min-height: 64px; }
.player .ctl { display: flex; gap: 2px; flex: none; }
.player .count { font: 600 12px var(--mono); color: var(--text-2); width: 46px; text-align: center; flex: none; }

.player .ev b { color: var(--t-purple); font-weight: 600; } .player .ev .bad { color: var(--t-red); font-weight: 600; }

/* crabs */
#crabs { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
.crab { position: absolute; left: 0; top: 0; width: 42px; height: 33px; transition: transform .55s ease-in-out; }
.crab svg { width: 42px; height: 33px; display: block; overflow: visible; shape-rendering: crispEdges; transform-origin: bottom center; transition: transform .3s; }
.crab.small svg { transform: scale(.55); }
.crab { transition: transform .55s ease-in-out, opacity .3s; }
.crab.gone { opacity: 0; }
.crowd { position: absolute; left: 0; top: 0; font: 700 10.5px var(--mono); color: var(--text-2); background: var(--card); border-radius: 9px; padding: 1px 6px; box-shadow: 0 0 0 .5px var(--sep-strong), 0 2px 6px rgba(0,0,0,.15); animation: fadein .3s; }

.pill.roster { border: 0; cursor: pointer; } .pill.roster:hover { background: var(--accent-bg); }
.roster-menu b, .roster-menu span { white-space: nowrap; }
.roster-menu { width: 300px; max-height: 360px; overflow: auto; }
.crab .claw, .crab .leg { transform-box: fill-box; }
.crab.idle svg { animation: bob 2.4s steps(2) infinite; }
.crab.walk .leg { animation: claw .14s steps(2) infinite; } .crab.walk .leg.b { animation-delay: .07s; }
.crab.busy .claw { animation: claw .24s steps(2) infinite; } .crab.busy .claw.r { animation-delay: .12s; }
.crab .sweat, .crab .bang { display: none; }
.crab.sweat .sweat, .crab.sweat .bang { display: inline; }
.crab .name { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); font: 600 9.5px var(--font); color: var(--c); white-space: nowrap; background: color-mix(in srgb, var(--window) 80%, transparent); padding: 0 3px; border-radius: 3px; }
.crab.small .name { display: none; }
.bubble { position: fixed; z-index: 45; pointer-events: none; transform: translate(-50%, -100%); font: 600 11px var(--mono); padding: 3px 7px; border-radius: 8px; background: var(--card); color: var(--text); box-shadow: 0 4px 14px rgba(0,0,0,.2), 0 0 0 .5px var(--sep-strong); white-space: nowrap; animation: bubble 1.9s ease-out forwards; }
.bubble.good { color: var(--t-green); } .bubble.bad { color: var(--t-red); }
.block { position: fixed; z-index: 44; width: 12px; height: 12px; border-radius: 3px; pointer-events: none; transition: transform .6s cubic-bezier(.4,0,.2,1), opacity .2s .55s; box-shadow: 0 2px 8px rgba(0,0,0,.25); }

@keyframes bob { 50% { transform: translateY(-1.5px); } }
@keyframes claw { 50% { transform: translateY(-2px); } }
@keyframes blink { 50% { opacity: .1; } }
@keyframes grow { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes flash { 0% { background: var(--accent-bg); } 100% { background: transparent; } }
@keyframes bubble { 0% { opacity: 0; margin-top: 6px; } 12% { opacity: 1; margin-top: 0; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: -8px; } }

@media (max-width: 860px) {

}

<div class="window">
  <header class="titlebar">

    <div class="tabs" id="tabs" role="tablist" aria-label="Tabs"></div>
    <button class="ib on" id="follow" title="Follow the acting agent across tabs (F)"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg><span class="lbl">Follow</span></button>

  </header>

<!-- The engine: the LayerFS SDK simulator and its shell, shared with tui.html. -->
<script src="simulation_engine/model.js"></script>
<script src="simulation_engine/files.js"></script>
<script src="simulation_engine/terminal.js"></script>
<script src="simulation_engine/backend/sim.js"></script>
<script src="scenarios.js"></script>
<script>
"use strict";
// ------------------------------------------------------------------ cast
const AGENTS = {
  main:     { color: "#a347d4", crown: true },
  "ui-dev": { color: "#0a6cff" },
  tester:   { color: "#1f9d55" },
};
const SCOUTS = ["#d6336c", "#0f8b9a", "#e08600", "#5856d6", "#8e6e53", "#c2255c", "#2b8a3e", "#1971c2", "#9c36b5"].map((color, i) => {
  const n = `scout-${i + 1}`; AGENTS[n] = { color }; return n;
});
const RECENT_S = 90, CAP = { row: 3, term: 3, bench: 6, chip: 1 };
const BCOL = ["--b0", "--b1", "--b2", "--b3", "--b4", "--b5"];
const FADE_S = 30, MAX_TABS = 6;
const M = window.LayerSim, FM = window.LayerFiles, simulateShell = window.LayerTerm.simulateShell;
// Compressed sizes are computed asynchronously and shared across rebuilds.
const PACKED = new Map(), PACKING = new Set();
let renderSoon = null;
const rerender = () => { clearTimeout(renderSoon); renderSoon = setTimeout(() => render(), 40); };
const FIXTURE = window.LAYERFS_SCENARIOS[0].steps[0].args.files;

// ------------------------------------------------------------------ story
// Each step is one agent's call. dsh runs it on the engine; every outcome
// (ids, Conflict, merges) comes from the engine, never from this script.
//   { a, call, args }   an SDK call
//   { a, sh }           a shell command in the agent's mounted Workspace
//   { a: "dsh", ... }   dsh itself: spawn agents, a burst of calls, a pause
const STORY = [
  { a: "main", call: "project.init", args: { name: "website", files: FIXTURE },
    cap: "<b>Main tab</b> = the project map: the project terminal (left), the Branch list (middle), and History or Files of main (right). Nothing is ever mounted on main." },
  { a: "main", call: "main.fork", args: { name: "feature-home" },
    cap: "The main agent forks a Branch. Branch calls land in the <b>project terminal</b>; a tab chip appears for the new Branch." },
  { a: "dsh", call: "dsh.spawn", args: { agents: ["ui-dev", "tester"] },
    cap: "dsh spawns two subagents. No scope, no assignment: they wait until they act." },
  { a: "ui-dev", call: "sandbox.mount", args: { branch: "feature-home" },
    cap: "<b>Follow</b> jumps to the Branch tab. dsh creates ui-dev's Sandbox and mounts a Workspace: a pane owned by ui-dev only." },
  { a: "ui-dev", sh: "mkdir -p app/components && echo 'export function Hero() { return <section>Hero</section>; }' > app/components/hero.tsx",
    cap: "Shell commands run in the Workspace (simulated shell). Their writes stay in the Workspace until a commit." },
  { a: "ui-dev", call: "sandbox.commit", args: { message: "add hero" },
    cap: "The commit lands on the Branch: a node in History, an A badge in Files." },
  { a: "tester", call: "sandbox.mount", args: { branch: "feature-home" },
    cap: "A second agent mounts its own Workspace on the same Branch. <b>One Branch, many agents; one Workspace, one agent.</b>" },
  { a: "main", call: "fs.read", args: { ref: "feature-home", path: "/app/page.tsx" },
    cap: "The main agent uses <code>fs</code> calls. They go to the Branch's <b>fs terminal</b> on the left, tagged by agent." },
  { a: "main", call: "fs.edit", args: { branch: "feature-home", path: "/app/page.tsx", oldText: "Hello world", newText: "Welcome back", message: "headline copy" },
    cap: "An fs write commits straight to the Branch — no mount, no pane. Both mount badges in History turn red: those Workspaces are now behind." },
  { a: "tester", sh: "sed -i 's/Hello world/Hello there/' app/page.tsx",
    cap: "Meanwhile tester edits the same line in its stale Workspace." },
  { a: "tester", call: "sandbox.commit", args: { message: "friendlier headline" },
    cap: "The engine merges three-way and finds a <b>Conflict</b>. Nothing is committed; the pane and tab chip turn red." },
  { a: "tester", sh: "cat app/page.tsx",
    cap: "The engine wrote the conflict markers into tester's Workspace." },
  { a: "tester", sh: "sed -i '/Welcome back\\|<<<<<<<\\|=======\\|>>>>>>>/d' app/page.tsx",
    cap: "tester keeps its own line and drops the markers…" },
  { a: "tester", call: "sandbox.commit", args: { message: "resolve headline" },
    cap: "…and commits on the new head." },
  { a: "ui-dev", sh: "npm install && npm test" },
  { a: "ui-dev", sh: "npm run dev &",
    cap: "A background dev server. The <b>status bar</b> shows it under ui-dev's Sandbox while it runs." },
  { a: "ui-dev", call: "sandbox.commit", args: { message: "install deps" },
    cap: "ui-dev's Workspace is two Commits behind, but touched other files: the engine merges it cleanly and commits on the head." },
  { a: "ui-dev", call: "process.cancel", args: {},
    cap: "The engine refuses to unmount a busy Workspace, so ui-dev stops its server first." },
  { a: "ui-dev", call: "sandbox.unmount", args: {},
    cap: "Unmount closes the pane." },
  { a: "tester", call: "sandbox.unmount", args: {} },
  { a: "ui-dev", call: "branch.fork", args: { branch: "feature-home", name: "try-a" },
    cap: "Any agent forks any Branch, any time. Fork, merge and publish always show on the main tab." },
  { a: "tester", call: "branch.fork", args: { branch: "feature-home", name: "try-b" } },
  { a: "dsh", call: "dsh.spawn", args: { agents: SCOUTS },
    cap: "Scale it up: dsh spawns 9 scouts. Idle agents get no crabs on the main tab — just the count in the Branches header." },
  { a: "dsh", call: "dsh.burst", tab: "main",
    burst: SCOUTS.map((n, i) => ({ a: n, call: "fs.read", args: { ref: ["feature-home", "try-a", "try-b"][i % 3 === 0 || i > 6 ? 0 : i % 3], path: ["/app/page.tsx", "/app/components/hero.tsx", "/README.md"][i % 3] } })),
    cap: "The scouts read across Branches. A row shows at most 3 crabs plus <b>+N</b>; tab chips cap their avatars the same way." },
  { a: "dsh", call: "dsh.view", tab: "feature-home",
    cap: "Inside a Branch tab the fs terminal caps its crowd too. Only agents on <i>this</i> Branch appear here." },
  { a: "ui-dev", call: "fs.write", args: { branch: "try-a", path: "/app/theme.css", content: ":root { --brand: #d97757; }\n", message: "warm theme" },
    cap: "One agent, many Branches: ui-dev is now on try-a. Its location comes from its last call — nothing was assigned." },
  { a: "tester", call: "sandbox.mount", args: { branch: "try-b" } },
  { a: "tester", sh: "sed -i 's/<section>/<section className=\"lazy\">/' app/components/hero.tsx" },
  { a: "tester", call: "sandbox.commit", args: { message: "lazy hero" } },
  { a: "tester", call: "sandbox.unmount", args: {} },
  { a: "main", call: "branch.merge", args: { branch: "try-a", with: "try-b", name: "release" },
    cap: "Merge never changes its inputs: the engine creates a new Branch from two." },
  { a: "main", call: "branch.publish", args: { branch: "release" },
    cap: "<b>Publish</b> is the one call that lands in main. A new Layer joins the main lane." },
  { a: "dsh", call: "dsh.idle", args: { seconds: 40 },
    cap: "Idle Branch tabs fade after ~30 s unless pinned; their history stays in the graph." },
  { a: "dsh", call: "dsh.view", tab: "feature-home",
    cap: "<b>Recently here:</b> a Branch tab's bench holds only idle agents whose last call was on this Branch, for ~90 s." },
];

// ------------------------------------------------------------------ driver
// W is the view model: the engine (W.sim) plus what dsh knows and the engine
// does not: which agent made each call, where each agent is, and the lines
// each terminal printed. derive() rebuilds the graph/branch/Workspace views
// from the engine state after every step.
const newAgent = () => ({ lastLoc: { kind: "bench" }, lastT: -99 });
function fresh() {
  const engine = new window.LayerBackendSim.SimBackend();
  engine.packed = PACKED; engine.packing = PACKING; engine.onchange = rerender;
  const W = { engine, sim: engine.sim, clock: 0, seq: 0, agents: { main: newAgent() }, panes: {}, fsLog: {}, hist: [], attrib: {}, touched: {},
    flash: {}, newNodes: new Set(), lastTab: "main", last: null };
  derive(W);
  return W;
}
const HIST = { "project.init": (a) => `init ${a.name}`, "main.fork": (a) => `fork ${a.name}`, "branch.fork": (a) => `fork ${a.name} --from ${a.branch}`,
  "branch.merge": (a) => `merge ${a.branch} ${a.with} --name ${a.name}`, "branch.publish": (a) => `publish ${a.branch}` };
const FS = { "fs.read": (a) => `read ${a.path}`, "fs.edit": (a) => `edit ${a.path} -m "${a.message}"`, "fs.write": (a) => `write ${a.path} -m "${a.message}"` };

function runStep(W, st) {
  const before = rootsOf(W), known = new Set(Object.keys(W.nodes));
  W.last = null;
  if (st.burst) { W.clock += 4; for (const e of st.burst) runCall(W, e); W.lastTab = st.tab; }
  else if (st.call === "dsh.view") W.lastTab = st.tab;
  else if (st.call === "dsh.spawn") { W.clock += 4; for (const n of st.args.agents) W.agents[n] ||= newAgent(); }
  else if (st.call === "dsh.idle") W.clock += st.args.seconds;
  else { W.clock += 4; runCall(W, st); }
  derive(W);
  W.newNodes = new Set(Object.keys(W.nodes).filter((id) => !known.has(id)));
  W.flash = changedPaths(W, before, rootsOf(W));
}

// One SDK call on the engine, timed in the page like SimBackend.run, with the
// inline Node script an agent would send (model.js scriptFor).
function sdkCall(W, calls, call, args) {
  const t0 = performance.now(), o = W.sim.run(call, args);
  o.timing = { totalMs: performance.now() - t0, simulated: true };
  calls.push({ call, code: o.code, timing: o.timing, script: M.scriptFor({ call, args }, (W.sim.s.project || {}).name || "website") });
  return o;
}
function runCall(W, st) {
  const n = st.a, A = (W.agents[n] ||= newAgent()), s = W.sim.s, seq = ++W.seq;
  let call = st.call, args = { ...st.args }, shOut = null, o, branch;
  const calls = [];
  const mine = A.ws && s.sandboxes[A.ws.sandbox].workspaces[A.ws.path], pane = A.ws && `${A.ws.sandbox}:${A.ws.path}`;
  const paneCall = !!st.sh || call === "sandbox.commit" || call === "sandbox.unmount" || call === "process.cancel";
  if (paneCall) { Object.assign(args, A.ws); branch = mine.branch; }
  if (call === "process.cancel" && !args.process) {
    const sb = s.sandboxes[A.ws.sandbox], run = sb.procOrder.map((id) => sb.processes[id]).filter((x) => x.path === A.ws.path && x.status === "running");
    args = { sandbox: A.ws.sandbox, process: run.length ? run[run.length - 1].id : "none" };
  }
  if (call === "sandbox.mount") {
    if (!A.sb) A.sb = sdkCall(W, calls, "sandbox.create", {}).result.id;
    args.sandbox = A.sb; branch = args.branch;
  }
  if (st.sh) {
    call = "sandbox.exec";
    const r = simulateShell(st.sh, mine, s.sandboxes[A.ws.sandbox]);
    shOut = r.out;
    o = r.refuse ? { ok: false, code: "ShellRefused", refusal: { message: r.out.map((x) => x.t).join(" ") } }
      : sdkCall(W, calls, call, { ...args, command: st.sh, writes: r.writes, output: r.out.map((x) => x.t).join("\n"), exitCode: r.code, background: r.background || undefined });
  } else o = sdkCall(W, calls, call, args);
  const out = outcome(call, o, shOut);
  W.last = { agent: n, call, step: st, o, node: nodeOf(o) };
  if (W.last.node) W.attrib[W.last.node] = n;
  if (o.ok && (o.code === "Forked" || o.code === "Merged")) W.attrib["fork:" + o.result.branch] = n;

  if (call.startsWith("fs.")) {
    branch = args.branch || args.ref;
    (W.fsLog[branch] ||= []).push({ agent: n, text: FS[call](args), out, t: seq, dim: call === "fs.read", calls });
    A.lastLoc = { kind: "fs", branch };
  } else if (call === "sandbox.mount") {
    if (o.ok) {
      A.ws = { sandbox: o.result.sandbox, path: o.result.path };
      const k = `${A.ws.sandbox}:${A.ws.path}`;
      W.panes[k] = { agent: n, born: seq, lines: [{ dim: true, text: `mount ${branch}`, out, t: seq, calls }] };
      A.lastLoc = { kind: "ws", branch, ws: k };
    } else { W.hist.push({ agent: n, text: `mount ${branch}`, out, t: seq, calls }); A.lastLoc = { kind: "hist" }; }
  } else if (paneCall) {
    if (call === "sandbox.unmount" && o.ok) { A.ws = null; A.lastLoc = { kind: "bench" }; A.lastBranch = branch; }
    else {
      W.panes[pane].lines.push({ text: st.sh || (call === "process.cancel" ? `kill ${args.process}` : `commit -m "${args.message}"`), out, t: seq, calls });
      A.lastLoc = { kind: "ws", branch, ws: pane };

    const lww = (list) => (list && list.length ? "<br>" + list.map((d) => `last-writer-wins ${esc(d.path)} ← ${esc(d.kept)}`).join("<br>") : "");
    const owner = (n) => (s.commits[n] ? `${esc(s.commits[n].branch)} ${n}` : `main ${n}`);
    const mrg = c.mergedFrom ? `<div class="sec">Merge</div><div class="meta">merged from ${owner(c.mergedFrom)} into ${c.parent ? owner(c.parent) : "main " + c.base}${c.mergeBase ? `<br>merge base ${esc(c.mergeBase)}` : ""}${lww(c.lww)}</div>`
      : c.merged ? `<div class="sec">Merged on commit</div><div class="meta">the Workspace was on ${c.merged.from}; merged with head ${c.merged.head}${lww(c.merged.lww)}</div>` : "";
    const after = c.displacedBy ? `<div class="sec">Off the line</div><div class="meta">${c.displacedBy} was committed with --force, so ${c.id} is no longer an ancestor of the head.</div>` : "";
    return `<div class="h"><b>${c.id}</b>${esc(c.branch)}${b.head === id ? head : ""}</div>
      <div class="meta">parent ${c.parent || "Branch base"} · root ${c.root}<br>${by}${by ? " · " : ""}${esc(c.message || c.via)}<br>via ${esc(c.by === "fs" ? c.via : c.by === "merge" ? "branch.merge" : "sandbox.commit " + c.via)}</div>${mrg}${after}${wsRows(c.branch, id)}${btns}`;
  }
  const name = id.slice(5), b = s.branches[name];
  return `<div class="h"><b>${esc(name)}</b>fork point${b.head ? "" : head}</div><div class="meta">forked from ${b.from}${b.head ? "" : " · no Commits yet"}${by ? "<br>" + by : ""}</div>${wsRows(name, id)}${btns}`;
}
function showCard(node) {
  clearTimeout(cardTimer);
  const card = $("hcard"), r = node.getBoundingClientRect();
  card.innerHTML = cardHtml(node.dataset.node);
  card.classList.add("open");
  const h = card.offsetHeight;
  card.style.left = Math.max(8, Math.min(innerWidth - 298, r.left + r.width / 2 - 145)) + "px";
  card.style.top = (r.bottom + 8 + h > innerHeight ? r.top - h - 8 : r.bottom + 8) + "px";
}
const hideCard = (now) => { clearTimeout(cardTimer); cardTimer = setTimeout(() => $("hcard").classList.remove("open"), now ? 0 : 180); };
$("work").addEventListener("mouseover", (e) => { const n = e.target.closest && e.target.closest("svg.graph [data-node]"); if (n) showCard(n); });
$("work").addEventListener("mouseout", (e) => { const n = e.target.closest && e.target.closest("svg.graph [data-node]"); if (n && !n.contains(e.relatedTarget)) hideCard(); });
$("hcard").addEventListener("mouseenter", () => clearTimeout(cardTimer));
$("hcard").addEventListener("mouseleave", () => hideCard());
// Card buttons open the node's lane at that point, in Files.
$("hcard").addEventListener("click", (e) => {
  const b = e.target.closest("[data-card-at], [data-card-cmp]"); if (!b) return;
  const id = b.dataset.cardAt || b.dataset.cardCmp, n = W.nodes[id]; if (!n) return;
  const lane = n.branch || "main";
  active = lane; follow = false; $("follow").classList.remove("on");
  showPoint(lane, id); filesOf(lane).mode = b.dataset.cardCmp ? "diff" : "view";
  hideCard(true); render();
});

// ------------------------------------------------------------------ crabs
function crabEl(n) {
  let el = $("crabs").querySelector(`[data-crab="${n}"]`);
  if (!el) {
    el = document.createElement("div"); el.className = "crab idle"; el.dataset.crab = n;
    el.style.setProperty("--c", AGENTS[n].color);
    el.innerHTML = mascot(n) + `<span class="name">${esc(n)}</span>`;
    el.style.transform = `translate(${innerWidth / 2}px, ${innerHeight - 120}px)`;
    $("crabs").appendChild(el);
  }
  return el;
}
// The element an agent stands on in the current tab, or null when this tab
// has nothing to say about it (idle on main, idle elsewhere on a Branch tab).
function targetOf(n) {
  const l = where(n), q = (s) => document.querySelector(`[data-loc="${s}"]`), chip = (t) => document.querySelector(`[data-tab="${t}"]`) || document.querySelector("[data-more]");
  if (l.kind === "bench") return active !== "main" && recentlyOn(active).includes(n) ? { el: q("bench"), mode: "bench" } : { el: null };
  if (active === "main") return l.kind === "hist" ? { el: q("hist"), mode: "term" } : { el: q("row:" + l.branch), mode: "row" };
  if (l.kind === "hist") return { el: chip("main"), mode: "chip" };
  if (l.branch !== active) return { el: chip(l.branch), mode: "chip" };
  return { el: q(l.kind === "ws" ? "ws:" + l.ws : "fs:" + l.branch), mode: l.kind === "ws" ? "pane" : "term" };
}
function placeCrabs() {
  const ev = STORY[step - 1], groups = new Map();
  for (const b of $("crabs").querySelectorAll(".crowd")) b.remove();
  // after a rewind, agents not spawned yet at this step have no crab
  for (const el of $("crabs").querySelectorAll(".crab")) if (!W.agents[el.dataset.crab]) el.classList.add("gone");
  // the acting agent first, so a capped host never hides the one doing the work
  const acting = new Set(ev && ev.burst ? ev.burst.map((e) => e.a) : ev ? [ev.a] : []);
  const names = Object.keys(W.agents).sort((x, y) => acting.has(y) - acting.has(x));
  for (const n of names) {
    const el = crabEl(n), t = targetOf(n);
    if (!t.el) { el.classList.add("gone"); continue; }
    if (!groups.has(t.el)) groups.set(t.el, { mode: t.mode, list: [] });
    groups.get(t.el).list.push(n);
  }
  for (const [host, { mode, list }] of groups) {
    const r = host.getBoundingClientRect(), cap = mode === "pane" ? 1 : CAP[mode];
    list.forEach((n, k) => {
      const el = crabEl(n);
      if (k >= cap) { el.classList.add("gone"); return; }
      let x, y;
      if (mode === "chip") { x = r.right - 30; y = r.bottom - 22; }
      else if (mode === "row") { x = r.right - 92 - k * 40; y = r.top + r.height / 2 - 20; }
      else if (mode === "bench") { x = r.left + 116 + k * 50; y = r.top + r.height / 2 - 24; }
      else { x = r.right - 52 - k * 46; y = r.bottom - 74; }
      el.classList.remove("gone");
      el.classList.toggle("small", mode === "chip");
      const mood = Object.values(W.ws).some((w) => w.agent === n && w.bad) ? "sweat" : acting.has(n) && mode !== "bench" ? "busy" : "idle";
      el.classList.remove("idle", "busy", "sweat"); el.classList.add(mood);
      const pos = `${Math.round(x)},${Math.round(y)}`;
      if (el.dataset.pos !== pos) {
        el.dataset.pos = pos; el.style.transform = `translate(${x}px,${y}px)`;
        el.classList.add("walk"); clearTimeout(el.wt); el.wt = setTimeout(() => el.classList.remove("walk"), 560);
      }
    });
    if (list.length > cap && mode !== "chip") {
      const b = document.createElement("div"), k = cap;
      b.className = "crowd"; b.textContent = `+${list.length - cap}`;
      const x = mode === "row" ? r.right - 92 - k * 40 + 14 : mode === "bench" ? r.left + 116 + k * 50 + 4 : r.right - 52 - k * 46 + 10;
      const y = mode === "row" ? r.top + r.height / 2 - 6 : mode === "bench" ? r.top + r.height / 2 - 8 : r.bottom - 58;
      b.style.transform = `translate(${x}px,${y}px)`; $("crabs").appendChild(b);
    }
  }
}
function bubbleOn(n, text, cls) {
  const el = $("crabs").querySelector(`[data-crab="${n}"]`); if (!el) return;
  setTimeout(() => {
    const r = el.getBoundingClientRect(), b = document.createElement("div");
    b.className = "bubble " + (cls || ""); b.textContent = text;
    b.style.left = r.left + r.width / 2 + "px"; b.style.top = r.top - 2 + "px";
    document.body.appendChild(b); setTimeout(() => b.remove(), 2000);
  }, 560);
}
function flyBlock(n, nodeId, color) {
  const crab = $("crabs").querySelector(`[data-crab="${n}"]`), target = document.querySelector(`[data-node="${nodeId}"]`);
  if (!crab || !target) return;
  setTimeout(() => {
    const a = crab.getBoundingClientRect(), z = target.getBoundingClientRect(), b = document.createElement("div");
    b.className = "block"; b.style.background = color; b.style.left = a.left + 15 + "px"; b.style.top = a.top + 8 + "px";
    document.body.appendChild(b);
    requestAnimationFrame(() => requestAnimationFrame(() => { b.style.transform = `translate(${z.left + z.width / 2 - a.left - 21}px,${z.top + z.height / 2 - a.top - 14}px) scale(.7)`; b.style.opacity = "0"; }));
    setTimeout(() => b.remove(), 900);
  }, 520);
}

// ------------------------------------------------------------------ player
function rebuild(to) { W = fresh(); for (let i = 0; i < to; i++) runStep(W, STORY[i]); }
function goto(i, animate) {
  i = Math.max(0, Math.min(STORY.length, i));
  if (animate && i === step + 1) runStep(W, STORY[step]); else rebuild(i);
  step = i;
  const ev = STORY[step - 1];
  lastLoc = null;
  if (ev && ev.a !== "dsh") { const l = where(ev.a); lastLoc = l.kind === "ws" ? "ws:" + l.ws : l.kind === "fs" ? "fs:" + l.branch : l.kind === "hist" ? "hist" : null; }
  if (follow && ev && ev.call !== "dsh.spawn") active = W.lastTab || "main";
  render(); renderPlayer();
  if (animate && ev && ev.a !== "dsh" && W.last) {
    const b = bubbleOf(W.last);
    if (b) bubbleOn(ev.a, b[0], b[1]);
    const id = W.last.node;
    if (id && W.nodes[id]) flyBlock(ev.a, id, W.nodes[id].branch ? css(W.branches[W.nodes[id].branch].color) : css("--purple"));
  }
}
function renderPlayer() {
  const ev = STORY[step - 1];
  $("p-count").textContent = `${step}/${STORY.length}`;
  let cap = ""; for (let i = step - 1; i >= 0 && !cap; i--) if (STORY[i].cap) cap = STORY[i].cap;
  $("p-cap").innerHTML = cap || "Press ▶ to play the story, or step with ← →.";
  const shown = (st) => st.sh ? `sandbox.exec ${JSON.stringify({ command: st.sh })}` : `${st.call} ${JSON.stringify(Object.fromEntries(Object.entries(st.args || {}).filter(([k]) => !["files", "content", "agents"].includes(k))))}`;
  $("p-ev").innerHTML = ev && ev.burst ? `events · <b>×${ev.burst.length}</b> ${esc([...new Set(ev.burst.map((e) => e.call))].join(", "))} from ${ev.burst.length} agents`
    : ev && ev.a !== "dsh" ? `event · <b>${esc(ev.a)}</b> ${esc(shown(ev))}${W.last ? ` → <span class="${W.last.o.ok ? "" : "bad"}">${esc(W.last.o.code)}</span>` : ""}`
    : ev ? `dsh · ${esc(ev.call.slice(4))}` : "event · —";
  $("p-dots").innerHTML = STORY.map((_, i) => `<i class="${i < step - 1 ? "done" : i === step - 1 ? "now" : ""}" data-step="${i + 1}" title="step ${i + 1}"></i>`).join("");
  $("p-play").textContent = playing ? "❚❚" : "▶";
}
function tick() {
  clearTimeout(timer);
  if (!playing) return;
  if (step >= STORY.length) { playing = false; renderPlayer(); return; }
  goto(step + 1, true);
  timer = setTimeout(tick, 2300 / +$("p-speed").value);
}
function setPlaying(p) { playing = p; renderPlayer(); clearTimeout(timer); if (p) timer = setTimeout(tick, 400); }

$("p-play").onclick = () => { if (!playing && step >= STORY.length) goto(0); setPlaying(!playing); };
$("p-next").onclick = () => { setPlaying(false); goto(step + 1, true); };
$("p-prev").onclick = () => { setPlaying(false); goto(step - 1); };
$("p-reset").onclick = () => { setPlaying(false); goto(0); };
$("p-dots").onclick = (e) => { const s = e.target.dataset.step; if (s) { setPlaying(false); goto(+s); } };
$("follow").onclick = () => { follow = !follow; $("follow").classList.toggle("on", follow); if (follow) goto(step); };
$("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches, cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark"; render();
};
// Files controls, and History nodes that open Files at that point.
function filesClick(e) {
  const t = e.target, at = (sel) => t.closest(sel);
  const tabOfPane = () => active;
  let el;
  if ((el = at("[data-fmode]"))) { const [tab, m] = el.dataset.fmode.split("|"); filesOf(tab).mode = m; render(); return true; }
  if ((el = at("[data-fbase]"))) { const [tab, v] = el.dataset.fbase.split("|"); filesOf(tab).base = v; render(); return true; }
  if ((el = at("[data-fsdk]"))) { const p = filesOf(el.dataset.fsdk); p.sdk = !p.sdk; render(); return true; }
  if ((el = at("[data-ftree]"))) {
    const p = filesOf(tabOfPane()), path = el.dataset.ftree;
    if (el.dataset.ftype === "dir") { p.toggled = p.toggled.includes(path) ? p.toggled.filter((x) => x !== path) : [...p.toggled, path]; }
    else p.path = path;
    render(); return true;
  }
  if ((el = at("[data-fopen]"))) { const p = filesOf(tabOfPane()); p.path = el.dataset.fopen; if (p.mode === "view") p.mode = "diff"; render(); return true; }
  if ((el = at("[data-fblame]"))) { const p = filesOf(tabOfPane()), id = el.dataset.fblame; showPoint(tabOfPane(), id); p.mode = "diff"; render(); return true; }
  if ((el = at("svg.graph [data-node]"))) { showPoint(tabOfPane(), el.dataset.node); render(); return true; }
  return false;
}
// Points Files at one node: on this tab's lane it pins the subject there; any
// other node becomes the subject's base. The base defaults to its parent.
function showPoint(tab, id) {
  const p = filesOf(tab), n = W.nodes[id]; if (!n) return;
  const lane = n.branch || "main";
  if (lane === tab) { p.at = n.kind === "fork" ? "fork:" + tab : id; p.base = FM.parentRef(W.sim, p.at) || ""; }
  else p.base = n.kind === "fork" ? id : id;
  rightMode[tab] = "files";
}
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.fat) { const p = filesOf(t.dataset.fat); p.at = t.value; p.base = p.at === "latest" ? defaultBase(t.dataset.fat) : FM.parentRef(W.sim, p.at) || ""; render(); }
  else if (t.dataset.fchanged) { filesOf(t.dataset.fchanged).changedOnly = t.checked; render(); }
});
function closeMenu() { const m = document.querySelector(".menu"); if (m) m.remove(); }
$("tabs").onclick = (e) => {
  closeMenu();
  const pin = e.target.closest("[data-pin]");
  if (pin) { const b = pin.dataset.pin; pinned[b] = !pinned[b]; e.stopPropagation(); render(); return; }
  const more = e.target.closest("[data-more]");
  if (more) {
    const r = more.getBoundingClientRect(), m = document.createElement("div");
    m.className = "menu"; m.style.left = r.left + "px"; m.style.top = r.bottom + 4 + "px";
    m.innerHTML = visibleTabs().hidden.map((b) => `<button data-open="${b}"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(${W.branches[b].color})"></span>${esc(b)}</button>`).join("");
    document.body.appendChild(m); return;
  }
  const t = e.target.closest("[data-tab]");
  if (t) { active = t.dataset.tab; follow = false; $("follow").classList.remove("on"); render(); }
};
document.addEventListener("click", (e) => {
  const sd = e.target.closest("[data-sdk]");
  if (sd) { const k = sd.dataset.sdk; OPEN_SDK.has(k) ? OPEN_SDK.delete(k) : OPEN_SDK.add(k); render(); return; }
  if (filesClick(e)) return;
  const ro = e.target.closest("[data-roster]");
  if (ro) { closeMenu(); rosterMenu(ro); return; }
  const r = e.target.closest("[data-right]");
  if (r) { const [t, m] = r.dataset.right.split(":"); rightMode[t] = m; render(); return; }
  const o = e.target.closest("[data-open]");
  if (o) { active = o.dataset.open; follow = false; $("follow").classList.remove("on"); closeMenu(); render(); }
  else if (!e.target.closest("[data-more]") && !e.target.closest(".menu")) closeMenu();
});
document.addEventListener("keydown", (e) => {
  if (e.key === " ") { e.preventDefault(); $("p-play").click(); }
  else if (e.key === "ArrowRight") $("p-next").click();
  else if (e.key === "ArrowLeft") $("p-prev").click();
  else if (e.key === "f" || e.key === "F") $("follow").click();
});
addEventListener("resize", () => placeCrabs());
// Narrow layouts scroll the page or a column: crabs stay with their hosts.
addEventListener("scroll", () => placeCrabs(), { capture: true, passive: true });

goto(0); renderPlayer(); setPlaying(true);
</script>
</body>
