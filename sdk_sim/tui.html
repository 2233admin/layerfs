<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerFS Terminals</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Monaco, monospace;
  --window: #fff; --chrome: #ececef; --card: #fff; --well: #f2f2f5; --grid-bg: #e4e4e8;
  --text: #1d1d1f; --text-2: #6e6e73; --text-3: #a1a1a6; --sep: rgba(0,0,0,.09); --sep-strong: rgba(0,0,0,.16);
  --accent: #007aff; --accent-bg: rgba(0,122,255,.12); --blue: #007aff; --green: #28a745; --orange: #e08600; --red: #ff3b30; --purple: #a347d4;
  --orange-bg: rgba(255,149,0,.14); --purple-bg: rgba(175,82,222,.13); --red-bg: rgba(255,59,48,.12); --green-bg: rgba(52,199,89,.14);
  --gray-node: #c7c7cc;
  /* light terminal palette */
  --term: #ffffff; --term-head: #f5f5f7; --term-border: rgba(0,0,0,.12); --term-text: #1d1d1f; --term-dim: #86868b; --term-sel: rgba(0,122,255,.18);
  --t-blue: #0058d0; --t-green: #1a7f37; --t-orange: #b35c00; --t-red: #d1242f; --t-purple: #8a3ab9; --t-cyan: #0a7590;
  --t-add-bg: rgba(26,127,55,.08); --t-del-bg: rgba(209,36,47,.08);
  --b0: #0a6cff; --b1: #1f9d55; --b2: #0f8b9a; --b3: #d6336c; --b4: #5856d6; --b5: #8e6e53;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --window: #1e1e20; --chrome: #2a2a2d; --card: #2c2c2f; --well: #252528; --grid-bg: #141416;
  --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73; --sep: rgba(255,255,255,.08); --sep-strong: rgba(255,255,255,.16);
  --accent: #0a84ff; --accent-bg: rgba(10,132,255,.18); --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2;
  --orange-bg: rgba(255,159,10,.16); --purple-bg: rgba(191,90,242,.16); --red-bg: rgba(255,69,58,.16); --green-bg: rgba(48,209,88,.16);
  --gray-node: #545458;
  --term: #1c1c1e; --term-head: #252528; --term-border: rgba(255,255,255,.08); --term-text: #e5e5ea; --term-dim: #8e8e93; --term-sel: rgba(10,132,255,.3);
  --t-blue: #64b5ff; --t-green: #5fd97a; --t-orange: #ffb340; --t-red: #ff6b61; --t-purple: #d38cff; --t-cyan: #64d2ff;
  --t-add-bg: rgba(95,217,122,.1); --t-del-bg: rgba(255,107,97,.1);
  --b0: #4aa3ff; --b1: #3ecf74; --b2: #3cc6d4; --b3: #ff6b9a; --b4: #8e8cff; --b5: #c09a78;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --window: #1e1e20; --chrome: #2a2a2d; --card: #2c2c2f; --well: #252528; --grid-bg: #141416;
  --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #6e6e73; --sep: rgba(255,255,255,.08); --sep-strong: rgba(255,255,255,.16);
  --accent: #0a84ff; --accent-bg: rgba(10,132,255,.18); --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2;
  --orange-bg: rgba(255,159,10,.16); --purple-bg: rgba(191,90,242,.16); --red-bg: rgba(255,69,58,.16); --green-bg: rgba(48,209,88,.16);
  --gray-node: #545458;
  --term: #1c1c1e; --term-head: #252528; --term-border: rgba(255,255,255,.08); --term-text: #e5e5ea; --term-dim: #8e8e93; --term-sel: rgba(10,132,255,.3);
  --t-blue: #64b5ff; --t-green: #5fd97a; --t-orange: #ffb340; --t-red: #ff6b61; --t-purple: #d38cff; --t-cyan: #64d2ff;
  --t-add-bg: rgba(95,217,122,.1); --t-del-bg: rgba(255,107,97,.1);
  --b0: #4aa3ff; --b1: #3ecf74; --b2: #3cc6d4; --b3: #ff6b9a; --b4: #8e8cff; --b5: #c09a78;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--font); color: var(--text); background: var(--window); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
::selection { background: var(--term-sel); }
body.nosel, body.nosel * { user-select: none !important; -webkit-user-select: none !important; }

.window { height: 100%; display: flex; flex-direction: column; background: var(--window); overflow: hidden; }

.titlebar { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; background: var(--chrome); border-bottom: .5px solid var(--sep); }
.brand { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-right: 8px; white-space: nowrap; }
.brand small { font-weight: 400; color: var(--text-2); font-size: 11px; }
.tabs { display: flex; gap: 4px; align-items: center; min-width: 0; overflow-x: auto; flex: 1; scrollbar-width: none; }
.tab { height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 6px 0 11px; border-radius: 7px; cursor: pointer; color: var(--text-2); white-space: nowrap; }
.tab:hover { background: var(--sep); }
.tab[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px var(--sep); }
.tab .ico { font-size: 11px; color: var(--bc, var(--text-2)); } .tab.main .ico { color: var(--purple); }
.tab .bd { font: 10.5px var(--mono); padding: 0 5px; border-radius: 4px; color: var(--text-3); }
.tab .bd.m { background: var(--orange-bg); color: var(--orange); }
.tab .x { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; opacity: 0; font-size: 11px; }
.tab:hover .x { opacity: .7; } .tab .x:hover { background: var(--sep-strong); opacity: 1; }
.tab.enter { animation: grow .3s ease-out; }
.ib { height: 28px; min-width: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ib:hover { background: var(--sep); color: var(--text); }
.ib svg { width: 15px; height: 15px; }
.ib.on { color: var(--accent); }
.ib.primary { background: var(--accent); color: #fff; } .ib.primary:hover { filter: brightness(1.08); background: var(--accent); color: #fff; }
.ib:disabled { opacity: .4; cursor: default; }
.kbd { font: 10.5px var(--mono); opacity: .65; }

.work { flex: 1; min-height: 0; display: flex; background: var(--grid-bg); padding: 6px; padding-bottom: calc(6px + var(--playerh, 0px)); }
.vh { width: 6px; flex: none; cursor: col-resize; position: relative; }
.vh[hidden] { display: none; }
.vh::after, .hh::after { content: ""; position: absolute; border-radius: 2px; transition: background .15s; }
.vh::after { top: 8px; bottom: 8px; left: 2px; width: 2px; }
.vh:hover::after, .vh.active::after, .hh:hover::after, .hh.active::after { background: var(--accent); }
.hh { height: 6px; flex: none; cursor: row-resize; position: relative; background: var(--term-head); }
.hh::after { left: 8px; right: 8px; top: 2px; height: 2px; }

.term { display: flex; flex-direction: column; background: var(--term); border-radius: 8px; overflow: hidden; min-width: 0; min-height: 0; box-shadow: 0 0 0 1px var(--term-border); position: relative; }
.term.focused { box-shadow: 0 0 0 1.5px var(--accent), 0 6px 18px rgba(0,0,0,.12); }
.thead { height: 30px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 6px; background: var(--term-head); color: var(--term-text); font-size: 12px; border-bottom: 1px solid var(--term-border); user-select: none; }
.kind { font: 700 10px var(--mono); padding: 1px 5px; border-radius: 4px; letter-spacing: .03em; flex: none; }
.kind.fs { background: var(--accent-bg); color: var(--t-blue); }
.kind.sandbox { background: var(--orange-bg); color: var(--t-orange); }
.kind.history { background: var(--purple-bg); color: var(--t-purple); }
.ttl { font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.pills { display: flex; gap: 5px; align-items: center; margin-left: auto; flex: 0 1 auto; min-width: 0; overflow: hidden; }
.pill { font: 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--well); color: var(--term-dim); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.pill.warn { background: var(--red-bg); color: var(--t-red); }
.pill.dirty, .pill.lock { background: var(--orange-bg); color: var(--t-orange); }
.pill.run { background: var(--green-bg); color: var(--t-green); }
.pill .stop { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 0 0 0 2px; font-size: 10px; }
.pbtn { width: 22px; height: 22px; border: 0; border-radius: 4px; background: transparent; color: var(--term-dim); cursor: pointer; display: grid; place-items: center; flex: none; }
.pbtn:hover { background: var(--sep); color: var(--term-text); }
.pbtn svg { width: 13px; height: 13px; }
.grip { width: 16px; height: 22px; display: grid; place-items: center; cursor: grab; color: var(--term-dim); border-radius: 4px; flex: none; }
.grip:hover { background: var(--sep); }
.term.narrow .pills .pill:not(.run):not(.warn), .term.narrow .pbtn.hide-narrow { display: none; }
.tbody { flex: 1; min-height: 0; overflow: auto; padding: 8px 10px 6px; font: 12px/1.55 var(--mono); color: var(--term-text); white-space: pre-wrap; word-break: break-word; cursor: text; }
.ln { position: relative; }
.pr-fs { color: var(--t-blue); } .pr-ro { color: var(--t-purple); } .pr-sb { color: var(--t-green); } .pr-h { color: var(--t-purple); } .pr-dim { color: var(--term-dim); }
.c-dim { color: var(--term-dim); } .c-ok { color: var(--t-green); } .c-err { color: var(--t-red); } .c-warn { color: var(--t-orange); } .c-info { color: var(--t-cyan); }
.c-add { color: var(--t-green); background: var(--t-add-bg); } .c-del { color: var(--t-red); background: var(--t-del-bg); } .c-mod { color: var(--t-blue); }
.sdkbtn { margin-left: 8px; font: 9.5px var(--mono); padding: 0 4px; border-radius: 3px; border: 1px solid var(--term-border); background: transparent; color: var(--term-dim); cursor: pointer; opacity: 0; vertical-align: 1px; }
.ln:hover .sdkbtn, .ln.open .sdkbtn, .sdkbtn:focus-visible { opacity: 1; }
.sdk { display: none; margin: 3px 0 5px; padding: 6px 9px; border-left: 2px solid var(--t-cyan); background: var(--well); border-radius: 0 6px 6px 0; color: var(--term-text); font-size: 11.5px; }
.ln.open .sdk { display: block; }
.sdk .code { color: var(--term-dim); display: block; margin-bottom: 4px; }
.sdk .code b { color: var(--t-cyan); font-weight: 600; }
.sdk pre { margin: 0 0 6px; font: inherit; white-space: pre-wrap; }
.tm { margin-left: 8px; font: 9.5px var(--mono); color: var(--term-dim); vertical-align: 1px; }
.sdk .tm { margin-left: 6px; font-size: 10.5px; }
.store { flex: none; border-top: 1px solid var(--term-border); padding: 7px 10px 8px; font: 11px/1.4 var(--mono); color: var(--term-text); background: var(--well); }
.store .srow { display: flex; align-items: baseline; gap: 8px; }
.store .kind { font-weight: 600; font-size: 9.5px; letter-spacing: .06em; color: var(--term-dim); }
.store b { font-size: 12px; } .store .dim { color: var(--term-dim); } .store .est { margin-left: auto; color: var(--term-dim); font-size: 10px; }
.store .sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 6px 0 5px; background: var(--term-border); }
.store .sbar i, .store .sw { display: block; } .store .sw { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.store .p { background: var(--t-cyan); } .store .m { background: var(--orange); } .store .o { background: var(--green); }
.store .legend { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.inrow { display: flex; align-items: baseline; }
.inrow input { flex: 1; min-width: 30px; background: transparent; border: 0; outline: 0; color: var(--term-text); font: 12px/1.55 var(--mono); padding: 0; }
.term:not(.focused) .inrow input { caret-color: transparent; }
.lk { color: var(--t-blue); text-decoration: underline; cursor: pointer; }

.dock { flex: none; }
.dock[hidden] { display: none; }
#fsdock { width: var(--fsw, 360px); }
.right { width: var(--hw, 470px); flex: none; display: flex; flex-direction: column; min-height: 0; }
.right[hidden] { display: none; }
#filesdock, #histdock { flex: 1 1 0; min-height: 120px; }
.right.both #filesdock { flex: 0 0 var(--fh, 52%); }
.hh.rh { background: var(--grid-bg); }
.hh[hidden] { display: none; }
.graph { flex: 0 0 var(--gh, 44%); min-height: 80px; overflow: auto; background: var(--term); }
#hist-svg { display: block; }
#hist-svg text { font-family: var(--font); fill: var(--term-text); }
#hist-svg .lbl { font: 10px var(--mono); fill: var(--term-dim); }
#hist-svg .edge.jump { stroke: var(--bc); stroke-width: 1.6; }
#hist-svg .jumphead { fill: none; stroke: var(--bc); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#hist-svg .row-name { font-size: 12px; font-weight: 600; cursor: pointer; }
#hist-svg .row-name.active { text-decoration: underline; }
#hist-svg .row-sub { font-size: 10px; fill: var(--term-dim); }
#hist-svg .lblbg { fill: var(--term); }
#hist-svg .rowband { fill: var(--accent-bg); }
#hist-svg .row-line { stroke: var(--term-border); stroke-dasharray: 2 4; }
#hist-svg .edge { fill: none; stroke: var(--term-dim); stroke-width: 1.8; }
#hist-svg .edge.main { stroke: var(--purple); stroke-width: 2.4; }
#hist-svg .edge.publish { stroke: var(--purple); stroke-width: 1.5; stroke-dasharray: 4 4; }
#hist-svg .edge.merge { stroke: var(--bc); stroke-width: 1.6; stroke-dasharray: 5 3; }
#hist-svg .mergehead { fill: none; stroke: var(--bc); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#hist-svg .commit .inner { fill: var(--term); pointer-events: none; }
#hist-svg .node { cursor: pointer; }
#hist-svg .node .shape { transform-box: fill-box; transform-origin: center; transition: transform .15s; }
#hist-svg .node:hover .shape { transform: scale(1.2); }
#hist-svg .layer .shape { fill: var(--purple); }
#hist-svg .commit .shape { fill: var(--bc); }
#hist-svg .fork .shape { fill: var(--term); stroke: var(--bc); stroke-width: 2; }
#hist-svg .mbadge { pointer-events: none; }
#hist-svg .mbadge circle { fill: var(--orange); stroke: var(--term); stroke-width: 1.5; }
#hist-svg .mbadge.stale circle { fill: var(--red); }
#hist-svg .mbadge text { fill: #fff; font: 700 8.5px var(--font); }
#hist-svg .hl .shape { stroke: var(--t-cyan); stroke-width: 3; }
#hist-svg .popin { animation: popin .5s cubic-bezier(.2,.9,.3,1.35); transform-box: fill-box; transform-origin: center; }

.gridwrap { flex: 1; min-width: 0; position: relative; }
#grid { position: absolute; inset: 0; display: flex; }
.gridwrap.benched #grid { bottom: 58px; }
#bench { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 52px; border-radius: 8px; background: var(--term-head); box-shadow: 0 0 0 1px var(--term-border); align-items: center; gap: 6px; padding: 0 10px; overflow: hidden; }
.gridwrap.benched #bench { display: flex; }
#bench .lbl { font: 600 10px var(--mono); color: var(--term-dim); letter-spacing: .04em; margin-right: 6px; white-space: nowrap; }
#bench .seat { display: flex; align-items: center; flex: 0 1 230px; min-width: 104px; height: 40px; padding-left: 48px; position: relative; }
#bench .seat > div { min-width: 0; overflow: hidden; }
#bench .seat small { overflow: hidden; text-overflow: ellipsis; }
#bench .seat b { font-size: 12px; color: var(--ac); display: block; }
#bench .seat small { font: 10.5px var(--mono); color: var(--term-dim); display: block; white-space: nowrap; }
.ctl { font: 700 10.5px var(--font); color: #fff; background: var(--ac); border-radius: 4px; padding: 1px 6px; flex: none; }
.split { display: flex; flex: 1; min-width: 0; min-height: 0; }
.split.row { flex-direction: row; } .split.column { flex-direction: column; }
.cell { display: flex; min-width: 0; min-height: 0; }
.divider { flex: none; position: relative; z-index: 2; }
.split.row > .divider { width: 6px; cursor: col-resize; } .split.column > .divider { height: 6px; cursor: row-resize; }
.divider::after { content: ""; position: absolute; border-radius: 2px; transition: background .15s; }
.split.row > .divider::after { top: 8px; bottom: 8px; left: 2px; width: 2px; } .split.column > .divider::after { left: 8px; right: 8px; top: 2px; height: 2px; }
.divider:hover::after, .divider.active::after { background: var(--accent); }
.pane { flex: 1; }
.pane.enter { animation: grow .28s cubic-bezier(.2,.9,.3,1.1); }
.pane.leave { animation: shrink .3s ease-in forwards; }
.pane.dragging { opacity: .35; }
.launcher { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--text-2); padding: 20px; }
.launcher h2 { margin: 0 0 6px; font-size: 16px; color: var(--text); }
.launcher p { margin: 0 auto 14px; max-width: 430px; line-height: 1.5; }
.zone { position: fixed; background: rgba(10,132,255,.18); border: 2px solid var(--accent); border-radius: 8px; pointer-events: none; z-index: 20; transition: all .12s ease; }
.zone span { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: var(--accent); color: #fff; font: 600 11px var(--font); padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
.ghostdrag { position: fixed; z-index: 60; pointer-events: none; background: var(--card); color: var(--text); font: 12px var(--mono); padding: 6px 10px; border-radius: 7px; box-shadow: 0 10px 30px rgba(0,0,0,.25), 0 0 0 .5px var(--sep-strong); transform: translate(12px, 12px); }

.statusbar { height: 32px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--chrome); border-top: .5px solid var(--sep); overflow-x: auto; scrollbar-width: none; font-size: 11px; }
.statusbar .lbl { color: var(--text-3); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 4px 0 8px; border-radius: 6px; font: 11px var(--mono); background: var(--card); box-shadow: 0 0 0 .5px var(--sep-strong); white-space: nowrap; }
.chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.chip.closed { opacity: .5; } .chip.closed .d { background: var(--text-3); }
.chip.detached { cursor: grab; box-shadow: 0 0 0 1px var(--orange); }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--text-2); border-radius: 4px; padding: 0 5px; height: 18px; }
.chip button:hover { background: var(--sep); color: var(--text); }
.statusbar .sp { flex: 1; min-width: 10px; }

.pop { position: fixed; z-index: 70; width: 300px; background: var(--card); border-radius: 10px; box-shadow: 0 14px 44px rgba(0,0,0,.28), 0 0 0 .5px var(--sep-strong); padding: 6px; display: none; }
.pop.open { display: block; animation: grow .16s ease-out; }
.pop h5 { margin: 6px 8px; font-size: 11px; color: var(--text-2); font-weight: 500; line-height: 1.4; }
.pop h5 b { color: var(--text); font-family: var(--mono); }
.opt { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; text-align: left; font: 12px var(--mono); }
.opt:hover, .opt:focus-visible { background: var(--accent); color: #fff; outline: 0; }
.opt small { margin-left: auto; font: 11px var(--font); color: var(--text-2); }
.opt:hover small, .opt:focus-visible small { color: rgba(255,255,255,.85); }
.hcard { position: fixed; z-index: 65; width: 290px; background: var(--card); border-radius: 10px; box-shadow: 0 14px 44px rgba(0,0,0,.24), 0 0 0 .5px var(--sep-strong); padding: 8px; display: none; font-size: 12px; }
.hcard.open { display: block; animation: grow .12s ease-out; }
.hcard .h { display: flex; align-items: baseline; gap: 6px; margin: 0 4px 2px; }
.hcard .h b { font: 600 13px var(--mono); }
.hcard .tag { font: 600 10px var(--font); padding: 1px 6px; border-radius: 4px; background: var(--accent-bg); color: var(--accent); }
.hcard .tag.gray { background: var(--well); color: var(--text-2); }
.hcard .meta { margin: 0 4px 6px; color: var(--text-2); font: 11px var(--mono); line-height: 1.5; }
.hcard .sec { margin: 6px 4px 3px; font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; }
.hcard .ws { width: 100%; display: flex; align-items: center; gap: 6px; padding: 5px 6px; border: 0; background: transparent; border-radius: 6px; cursor: pointer; text-align: left; font: 11.5px var(--mono); color: var(--text); }

$("d-story").innerHTML = Object.entries(STORIES).map(([k, v]) => `<option value="${k}"${k === story ? " selected" : ""}>${esc(v.title)} · ${v.steps.length}</option>`).join("");
$("d-story").onchange = (e) => { story = e.target.value; DEMO = STORIES[story].steps; demoRestart(true); };
const D = { i: 0, playing: false, speed: 1, token: 0, panes: {}, busy: false, instant: false, live: [] };
const PLAY = '<svg viewBox="0 0 16 16"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"/></svg>', PAUSE = '<svg viewBox="0 0 16 16"><path d="M4 3h3v10H4zM9 3h3v10H9z" fill="currentColor"/></svg>';
const wait = (ms) => (D.instant ? Promise.resolve() : new Promise((r) => setTimeout(r, reduced ? 0 : ms / D.speed)));
// Stories with acts show chapters instead of one dot per step; steps without

function actsOf() {
  const acts = [];
  DEMO.forEach((s, k) => { if (s.act || k === 0) acts.push({ title: s.act || "Start", start: k }); });
  acts.forEach((a, j) => (a.end = j + 1 < acts.length ? acts[j + 1].start : DEMO.length));
  return acts;
}
function renderPlayer(result) {

  $("d-speed").textContent = D.speed + "×";
  $("d-count").textContent = `${Math.min(D.i + (D.busy ? 1 : 0), DEMO.length)} / ${DEMO.length}`;
  $("d-dots").classList.toggle("acts", DEMO.some((s) => s.act));

      // "checkout 25%": the Branch name drops out when the chapter is narrow.
      const m = /^(\S+) (\d+%)$/.exec(a.title), label = m ? `<span class="nm">${esc(m[1])} </span>${m[2]}` : esc(a.title);
      return `<span class="act${D.i >= a.start && D.i < a.end ? " now" : ""}" style="flex:${a.end - a.start} 1 0${m ? `;--bc:${branchColor(m[1])}` : ""}" data-dseek="${a.start}" title="${esc(a.title)} · steps ${a.start + 1}–${a.end}"><span class="fill" style="width:${done * 100}%"></span><b>${label}</b></span>`;
    }).join("");
  } else $("d-dots").innerHTML = DEMO.map((st, k) => `<i class="${k < D.i ? "done" : k === D.i && D.busy ? "now" : ""}" title="${k + 1}. ${esc(st.note)}" data-dseek="${k}"></i>`).join("");
  const cur = Math.min(D.busy ? D.i : D.i - 1, DEMO.length - 1);
  let k = cur; while (k > 0 && !DEMO[k].note) k--;
  const st = DEMO[k];
  if (D.i >= DEMO.length && !D.busy) $("d-cap").innerHTML = `Done: ${DEMO.length} steps. Restart to replay, or keep typing in any terminal.`;
  else if (st && (D.busy || D.i > 0)) $("d-cap").innerHTML = esc(st.note || "") + (result && k === cur ? `<span class="res ${result === st.expect && !/Busy|Conflict|Dirty|exit:1/.test(result) ? "good" : "bad"}">${esc(result)}</span>` : "");
  else $("d-cap").textContent = "Press play. Each step types a real command into a terminal.";
  if (D.live && D.live.length && D.i < DEMO.length) $("d-cap").innerHTML += `<div class="live">${D.live.map((x) => `<div class="${x.cls}"><b style="color:${rosterOf(x.n).color}">${esc(rosterOf(x.n).name)}</b> ${esc(x.text)}</div>`).join("")}</div>`;
}
function lastCode(before) {
  // the outcome of the newest SDK call recorded in any transcript since `before`
  const all = [...S.hist.lines, ...Object.values(S.fs).flatMap((f) => f.lines), ...Object.values(S.panes).flatMap((p) => p.lines), ...Object.values(S.detached).flatMap((p) => p.lines)];
  const cmds = all.filter((l) => l.k === "cmd" && l.calls && l.calls.length && l.at > before);
  cmds.sort((a, b) => a.at - b.at);
  const c = cmds.pop(); if (c) return c.calls[c.calls.length - 1].code;
  return lastRecorded && lastRecorded.at > before ? lastRecorded.code : "";
}
async function hl(el, ms = 700) { if (!el || D.instant) return; el.classList.add("demo-hl"); await wait(ms); el.classList.remove("demo-hl"); }
async function typeLine(owner, line, tok, fast) {
  if (owner === "fs") S.docks.fs = true; if (owner === "hist") S.docks.h = true;
  setFocus(owner); render();
  const inp = () => document.querySelector(`[data-in="${owner}"]`);
  if (!(await typeInto(owner, line, tok, fast))) return false;
  inp().value = line;
  inp().dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  await inflight;
  return true;
}
// Types into an input without submitting; fast types several characters per tick.
async function typeInto(owner, line, tok, fast) {
  const inp = () => document.querySelector(`[data-in="${owner}"]`);
  const n = S.panes[owner] ? S.panes[owner].agent : S.roster && (owner === "fs" || owner === "hist") ? "lead" : null;
  if (n) typing[n] = owner;
  try { return await typeChars(owner, inp, line, tok, fast, n); } finally { if (n) delete typing[n]; }
}
async function typeChars(owner, inp, line, tok, fast, n) {
  if (!D.instant && !reduced) {
    const step = fast ? 3 : 1, per = fast ? 9 : line.length > 40 ? 14 : 26;
    for (let k = step; k < line.length + step; k += step) {
      if (tok !== D.token) return false;
      const i = inp(); if (i) i.value = line.slice(0, k);
      if (n) placeCrabs();
      await wait(per);
    }
    await wait(fast ? 90 : 220);
  }
  if (tok !== D.token) return false;
  const i = inp(); if (i) i.value = "";
  return true;
}
// Plays a step's tool calls on their timeline (demo.js schedule): each agent
// thinks at the bench, mounts (a window opens), types, runs, then commits and
// unmounts (it closes). Burst calls overlap and commit in the order they finish.
// Several agents at once play slower, and each commit holds for a moment, so
// the order, any conflict with history and the growing graph can be followed;
// the player lists every mount and outcome of the step as it happens.
const thinking = {}, typers = {}, BURST_SLOW = 2.4, COMMIT_HOLD = 1100;
async function playCalls(st, tok) {
  let at = 0, result = "";
  const ids = {}, slow = st.burst ? BURST_SLOW : 1;
  for (const ev of STORIES.schedule(st)) {
    await wait((ev.t - at) * slow); at = ev.t;
    if (tok !== D.token) return false;
    const n = ev.who;
    if (ev.phase === "think") thinking[n] = true;
    else if (ev.phase === "stop") { delete thinking[n]; result = (await agentStopUI(n)).code; }
    else if (ev.phase === "mount") {
      delete thinking[n]; ids[ev.k] = await agentMountUI(n, st.on);
      if (ids[ev.k]) typeFor(ids[ev.k], n, ev.line, ev.type * slow, tok);
      const b = S.agents[n].open, w = b && sim.s.sandboxes[b.sandbox].workspaces[b.path];
      if (st.burst && w) liveLog(n, `mounts ${w.branch} @ ${w.baseCommit || w.baseLayer}`);
    } else if (ev.phase === "exec") { endTyping(ids[ev.k], n); result = (await agentExecUI(n, ev.line)).code; }
    else if (ev.phase === "done") {
      agentDoneUI(n, ids[ev.k]); const f = await agentFinishUI(n); if (f) result = f.code;
      if (st.burst && f && f.event) { liveLog(n, outcomeText(f.event), f.event.kind === "conflict" ? "bad" : f.event.kind === "uptodate" ? "" : "good"); render(); await wait(COMMIT_HOLD); if (tok !== D.token) return false; }
    }
    render();
  }
  return result;
}
function outcomeText(ev) {
  if (ev.kind === "conflict") return ev.with ? `✕ was on ${ev.from} · conflicts with ${ev.with} · nothing committed, markers in its Workspace` : "✕ markers still in the files";
  if (ev.kind === "merged") return `⇣ was on ${ev.from} · merged with ${ev.with} → ${ev.head}`;
  if (ev.kind === "lww") return `⇄ was on ${ev.from} · merged with ${ev.with}, newer build output wins → ${ev.head}`;
  if (ev.kind === "uptodate") return "= nothing to commit";
  return `✓ commits ${ev.head}`;
}
function liveLog(n, text, cls = "") { if (D.instant) return; D.live.push({ n, text, cls }); renderPlayer(); }
// Types a line into a window over about ms, until its run starts.
async function typeFor(owner, n, line, ms, tok) {
  const job = {}, span = Math.max(ms - 120, 60), step = Math.max(1, Math.ceil((line.length * 18) / span)), per = span / Math.ceil(line.length / step);
  typers[owner] = job; typing[n] = owner;
  for (let k = step; k < line.length + step && !D.instant && !reduced; k += step) {
    if (tok !== D.token || typers[owner] !== job) return;
    const i = document.querySelector(`[data-in="${owner}"]`); if (i) i.value = line.slice(0, k);
    placeCrabs(); await wait(per);
  }
}
function endTyping(owner, n) {
  delete typers[owner]; if (typing[n] === owner) delete typing[n];
  const i = document.querySelector(`[data-in="${owner}"]`); if (i) i.value = "";
}
// A short card between Branch segments: the Branch and how far it is.
async function milestone(st, tok) {
  S.progress[st.milestone] = st.pct; render();
  if (D.instant || reduced) return;
  const g = $("gridwrap").getBoundingClientRect(), c = document.createElement("div");
  c.className = "mcard"; c.style.left = g.left + g.width / 2 + "px"; c.style.top = g.top + g.height / 2 + "px"; c.style.setProperty("--bc", branchColor(st.milestone));
  c.innerHTML = `<div><b>⎇ ${esc(st.milestone)}</b><span>${st.pct}%</span></div><i><em style="width:${st.pct - 25}%"></em></i><small>${esc(st.caption)}</small>`;
  $("fx").appendChild(c);
  requestAnimationFrame(() => (c.querySelector("em").style.width = st.pct + "%"));
  const hold = 2800 / D.speed;
  c.animate([{ opacity: 0, scale: .92 }, { opacity: 1, scale: 1, offset: .12 }, { opacity: 1, offset: .85 }, { opacity: 0 }], { duration: hold, easing: "ease-out" }).finished.then(() => c.remove());
  await wait(2800);
}
async function demoStep() {
  if (D.busy || D.i >= DEMO.length) return;
  const tok = D.token, st = DEMO[D.i], t0 = stamp, agentStory = !!STORIES[story].roster, fast = agentStory && !st.beat;
  let result = "";
  D.busy = true; D.live = []; if (!D.instant) renderPlayer();
  if (st.branch && S.active !== st.branch) { openTab(st.branch); render(); await wait(fast ? 220 : 500); if (tok !== D.token) return; }
  if (st.jump && S.crabs) { await jumpFx(st.jump); if (tok !== D.token) return; }
  if (st.ui === "agents") {
    seatAgents(st.branch, st.agents); result = "ok";
  } else if (st.milestone) {
    await milestone(st, tok); result = "ok";
  } else if (st.agent || st.burst) {
    if (agentStory) S.docks.fs = false;
    const r = await playCalls(st, tok);
    if (r === false) return;
    result = r;
  } else if (st.ui === "open") {
    S.active = S.active === "main" ? S.tabs[S.tabs.length - 1].branch : S.active; render();
    await hl($("new-sb"));
    if (tok !== D.token) return;
    openSandboxPicker($("new-sb"));
    const opt = $("pop").querySelector('[data-pickbox=""]'); await hl(opt, 600);
    if (tok !== D.token) return;
    const before = new Set(Object.keys(S.panes)); opt.click(); await inflight;
    D.panes[st.as] = Object.keys(S.panes).find((k) => !before.has(k));
  } else if (st.ui === "split") {
    const from = D.panes[st.from];
    await hl(document.querySelector(`[data-pane="${from}"] [data-act="right"]`));
    if (tok !== D.token) return;
    const before = new Set(Object.keys(S.panes)); await newSandboxTerminal(S.panes[from].sandbox, from, "right");
    D.panes[st.as] = Object.keys(S.panes).find((k) => !before.has(k));
  } else if (st.ui === "stop") {
    const btn = document.querySelector(`[data-pane="${D.panes[st.term]}"] [data-stop]`);
    await hl(btn ? btn.closest(".pill") : null);
    if (tok !== D.token) return;
    if (btn) { const [sb, pid] = btn.dataset.stop.split("|"); result = await stopProcess(sb, pid); }
  } else {
    const owner = st.term === "history" ? "hist" : st.term === "fs" ? "fs" : D.panes[st.term];
    for (const [n, line] of st.lines.entries()) { if (n) await wait(260); if (!(await typeLine(owner, line, tok, fast))) return; }
  }
  if (tok !== D.token) return;
  D.busy = false; D.i++;
  D.last = result || lastCode(t0) || "no SDK call";
  if (!D.instant) renderPlayer(D.last);
  await wait(agentStory ? (st.beat ? 2600 : 520) : st.lines && st.lines.length > 2 ? 1500 : 1300);
}
async function demoLoop() {
  const tok = D.token;
  while (D.playing && tok === D.token && D.i < DEMO.length) await demoStep();
  if (tok === D.token) { D.playing = false; renderPlayer(D.last); }
}
async function demoRestart(autoplay) {
  const tok = ++D.token; D.i = 0; D.busy = false; D.panes = {}; D.playing = false; D.last = ""; D.instant = false;
  try { localStorage.removeItem(KEY); } catch {}
  fxQueue = []; $("fx").innerHTML = ""; $("crabs").innerHTML = ""; for (const m of [typing, thinking, typers]) for (const k of Object.keys(m)) delete m[k];
  knownNodes = null;
  try { await fresh(true); } catch (error) { toast(`✕ ${error.message}`); console.warn(error); return; }
  if (tok !== D.token) return;
  S.focus = "hist"; S.progress = {};
  const sto = STORIES[story];
  D.speed = sto.speed || 1;
  if (sto.roster) { S.roster = sto.roster; eng.actor = "lead"; S.docks.fs = false; S.docks.files = false; S.docks.h = true; }
  render();
  $("player").classList.add("open"); renderPlayer();
  if (autoplay) { D.playing = true; renderPlayer(); demoLoop(); }
}
// Jump to a step: replay everything before it instantly, then play on.
async function demoSeek(k) {
  await demoRestart(false);
  const tok = D.token;
  D.instant = true;
  while (D.i < k && tok === D.token) await demoStep();
  D.instant = false;
  if (tok !== D.token) return;
  fxQueue = []; render(); D.playing = true; renderPlayer(D.last); demoLoop();
}
$("d-dots").addEventListener("click", (e) => { const t = e.target.closest("[data-dseek]"); if (t) demoSeek(+t.dataset.dseek); });
$("demo").onclick = () => demoRestart(true);
$("d-restart").onclick = () => demoRestart(true);
$("d-play").onclick = () => { if (D.i >= DEMO.length) return demoRestart(true); D.playing = !D.playing; renderPlayer(D.last); if (D.playing) demoLoop(); };
$("d-step").onclick = () => { D.playing = false; renderPlayer(D.last); demoStep(); };
$("d-speed").onclick = () => { D.speed = D.speed === 1 ? 2 : D.speed === 2 ? 4 : 1; $("d-speed").textContent = D.speed + "×"; };
$("d-close").onclick = () => { D.playing = false; D.token++; D.busy = false; $("player").classList.remove("open"); };
// The open player floats over the bottom of the work area: reserve its height

new ResizeObserver(() => {
  const h = $("player").classList.contains("open") ? $("player").offsetHeight + 18 : 0;

if (BACKEND === "live") { $("backend-label").textContent = "JS SDK · live"; $("backend-label").title = "Calls run on the real product through the local server"; }
(async () => {
  try { await load(); } catch (error) { toast(`✕ ${error.message}`); console.warn(error); return; }
  render();
  if (new URLSearchParams(location.search).has("demo")) demoRestart(true);
  // Live: a process that exits changes the project outside any call.
  if (sim.live) setInterval(() => sim.poll().then((changed) => { if (changed) render(); }, () => {}), 3000);
})();
