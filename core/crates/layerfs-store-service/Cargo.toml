[package]
name = "layerfs-store-service"
description = "Store calls (fs, branch, project, operator) over the global Store, and the Store and overlay ports Workspace Commits use. No FUSE, socket or Sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
layerfs-overlay = { path = "../layerfs-overlay" }
layerfs-workspace = { path = "../layerfs-workspace" }
layerfs-bridge = { path = "../layerfs-bridge" }
layerfs-content = { path = "../layerfs-content" }
layerfs-storage = { path = "../layerfs-storage" }
layerfs-history = { path = "../layerfs-history" }
layerfs-telemetry = { path = "../layerfs-telemetry" }
# Concrete Store opening (bootstrap) and the kernel guard's open.
layerfs-persistence = { path = "../layerfs-persistence" }
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }
